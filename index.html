function derive(d){const c=digits(d.cpf);const o={...d};if(c.length===11){if(!String(o.ctps||'').trim())o.ctps=c.slice(0,7);if(!String(o.ctpsSerie||'').trim())o.ctpsSerie=c.slice(7)}

  $('#back').onclick=()=>setView('home');
  const fm=$('#fm');
  fm.addEventListener('input',e=>{const el=e.target;if(el.closest('.imp'))return;
    if(el.dataset.k){const f=F[el.dataset.k];let val=el.type==='checkbox'?el.checked:el.value;if(f.t==='cpf'){val=digits(val);const p=el.selectionStart;el.value=fmtCPF(val);}S.data[el.dataset.k]=val;}
    else if(el.dataset.l){const arr=S.data[el.dataset.l]||(S.data[el.dataset.l]=[]);arr[+el.dataset.i][el.dataset.c]=el.value;}
    if(el.dataset.re||el.type==='checkbox'||el.tagName==='SELECT'){rerenderForm()}else{clearTimeout(tmr);tmr=setTimeout(refreshCalc,250)}
    if(S.edit){S.edit=false;render();return}
    clearTimeout(paintPreview._t);paintPreview._t=setTimeout(paintPreview,120);
  });
  fm.addEventListener('change',e=>{if(e.target.id==='impFiles'){IMP.files=[...e.target.files];IMP.res=null;IMP.msg=IMP.files.length?`${IMP.files.length} arquivo(s) escolhido(s).`:'';paintImp()}else if(e.target.id==='impReg'){IMP.reg=e.target.checked}});

    if(a){const k=a.dataset.add;const cols=F[k].cols;const row={};cols.forEach(([ck,,,ty])=>row[ck]=Array.isArray(ty)?(Array.isArray(ty[0])?ty[0][0]:ty[0]):'');(S.data[k]=S.data[k]||[]).push(row);rerenderForm();paintPreview()}
    if(x){S.data[x.dataset.del].splice(+x.dataset.i,1);rerenderForm();paintPreview()}});
  fm.addEventListener('submit',e=>e.preventDefault());
  $('#gen').onclick=()=>generate(true);if($('#reg'))$('#reg').onclick=()=>generate(false);

function missing(){
  const d=S.data,need=[];if(!d.unidade)need.push('unidade');if(!String(d.nome||'').trim())need.push('nome');if(digits(d.cpf).length!==11)need.push('CPF válido');

}

function fileName(){const t=TPL[S.tpl];let n=t.nome;if(S.tpl==='medida'){n=NIVEL[calcMedidaRaw(S.data).nivel]}return `${n} - ${String(S.data.nome||'').trim().toUpperCase()} - ${br(S.data.dataDoc||today()).replace(/\//g,'-')}.pdf`.replace(/[\\/:*?"<>|]/g,'-')}

async function generate(withPdf){
  const msg=$('#msg');const miss=missing();
  if(miss.length){msg.textContent='Falta preencher: '+miss.join(', ')+'.';return}
  const btn=withPdf?$('#gen'):$('#reg');btn.disabled=true;
  try{
    if(withPdf){
      
      msg.textContent='Montando o PDF…';
      const blob=await buildPdfBlob();
      if(!S.dl){if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);msg.textContent='PDF baixado.'}else msg.textContent='Esta visualização não permite baixar arquivos. Abra o portal pelo claude.ai.';}
      else{try{await S.dl.save({filename:fileName(),data:blob});msg.textContent='PDF pronto.'}catch(e){msg.textContent=e&&e.code==='declined'?'Download cancelado.':'Não consegui salvar o arquivo ('+(e&&e.code||'erro')+').';if(e&&e.code==='declined'){btn.disabled=false;return}}}
    }
    await saveHist();
    if(!withPdf)msg.textContent='Registrado no histórico.';
  }catch(e){msg.textContent=e.message||'Erro ao gerar.'}
  btn.disabled=false;
}
async function saveHist(){
  if(!S.db){if(window.claude)toast('Histórico indisponível: entre com sua conta para registrar.');return}
  const d=S.data,t=TPL[S.tpl];const rec={tpl:S.tpl,titulo:t.nome,nome:String(d.nome||'').trim().toUpperCase(),cpf:digits(d.cpf),unidade:d.unidade||'',dataRef:d.dataDoc||today(),criadoEm:new Date().toISOString(),por:S.uid||'',dados:JSON.parse(JSON.stringify(d))};
  if(S.tpl==='medida'){const c=calcMedidaRaw(d);rec.titulo=NIVEL[c.nivel];rec.nivel=c.nivel;rec.linha=c.al;rec.status='aguardando'}else rec.status='gerado';
  try{await S.db.collection('documentos').add(rec);toast('Registrado no histórico')}catch(e){toast('Não consegui registrar no histórico ('+(e.code||'erro')+').')}
}
function histMatches(d){const c=digits(d.cpf);if(c.length!==11)return[];const al=linhaDe(d);return S.hist.filter(h=>h.tpl==='medida'&&h.cpf===c&&h.linha===al&&h.nivel&&h.nivel!=='justa')}
function pullHist(){const m=histMatches(S.data);const arr=S.data.anteriores=S.data.anteriores||[];m.forEach(h=>{if(!arr.some(r=>r.data===h.dataRef&&r.nivel===h.nivel))arr.push({data:h.dataRef,nivel:h.nivel,assinada:h.status==='assinada'?'sim':'nao'})});arr.sort((a,b)=>String(a.data).localeCompare(String(b.data)));S.data.reincidente='sim';rerenderForm();paintPreview();toast('Medidas do histórico adicionadas. Só as assinadas contam para a escala.')}

/* ---------- histórico ---------- */
const HF={q:'',tipo:'',un:''};
function viewHist(){
  if(!S.db)return `<div class="panel empty">${S.histReady?'O histórico compartilhado só funciona na versão do portal aberta pelo Claude. Nesta versão, os documentos são gerados no seu navegador e nada é salvo.':'Carregando histórico…'}</div>`;
  const rows=S.hist.filter(h=>(!HF.q||(h.nome||'').includes(HF.q.toUpperCase())||(h.cpf||'').includes(digits(HF.q)||'#'))&&(!HF.tipo||TPL[h.tpl]?.cat===HF.tipo)&&(!HF.un||h.unidade===HF.un));
  return `<div class="filters"><input id="hq" placeholder="Buscar por nome ou CPF" value="${esc(HF.q)}" aria-label="Buscar"><select id="ht" aria-label="Categoria"><option value="">Todas as categorias</option>${CATS.map(c=>`<option value="${c.id}" ${HF.tipo===c.id?'selected':''}>${c.nome}</option>`).join('')}</select><select id="hu" aria-label="Unidade"><option value="">Todas as unidades</option>${UNITS.map(u=>`<option value="${u.id}" ${HF.un===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></div>
  ${rows.length?`<div class="tbl-wrap"><table class="tb"><thead><tr><th>Data</th><th>Documento</th><th>Colaborador</th><th>Unidade</th><th>Gerado por</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(h=>`<tr><td>${esc(br(h.dataRef))}</td><td>${esc(h.titulo)}${h.linha?` <span class="eyebrow">· alínea ${esc(h.linha)}</span>`:''}</td><td>${esc(h.nome)}<br><span class="eyebrow">${esc(fmtCPF(h.cpf))}</span></td><td>${esc(unitOf(h.unidade)?.nome||'—')}</td><td data-uid="${esc(h.por||'')}">${esc(S.names[h.por]||'—')}</td><td>${h.tpl==='medida'?`<select data-st="${h._id}" aria-label="Status"><option value="aguardando" ${h.status==='aguardando'?'selected':''}>Aguardando assinatura</option><option value="assinada" ${h.status==='assinada'?'selected':''}>Assinada</option><option value="cancelada" ${h.status==='cancelada'?'selected':''}>Não aplicada</option></select>`:'Gerado'}</td><td style="white-space:nowrap"><button class="btn sm" data-open="${h._id}">Reabrir</button> <button class="btn sm ghost" data-rm="${h._id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="panel empty">${S.hist.length?'Nenhum documento com esses filtros.':'Nenhum documento gerado ainda. Abra um modelo em <b>Modelos</b>, preencha e clique em <b>Gerar PDF</b> — ele aparece aqui para toda a equipe.'}</div>`}`;
}
function bindHist(){
  const q=$('#hq');if(!q)return;
  q.oninput=()=>{HF.q=q.value;const p=q.selectionStart;render();const n=$('#hq');n.focus();n.setSelectionRange(p,p)};
  $('#ht').onchange=e=>{HF.tipo=e.target.value;render()};$('#hu').onchange=e=>{HF.un=e.target.value;render()};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const h=S.hist.find(x=>x._id===b.dataset.open);if(h)openTpl(h.tpl,h.dados)});
  document.querySelectorAll('[data-st]').forEach(s=>s.onchange=async()=>{try{await S.db.doc('documentos/'+s.dataset.st).update({status:s.value});toast('Status atualizado')}catch(e){toast('Sem permissão para alterar ('+(e.code||'erro')+')')}});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Confirmar exclusão';b.classList.remove('ghost');return}try{await S.db.doc('documentos/'+b.dataset.rm).delete();toast('Excluído do histórico')}catch(e){toast('Não consegui excluir ('+(e.code||'erro')+')')}});
}
async function resolveNames(){
  if(!S.user)return;const ids=[...new Set(S.hist.map(h=>h.por).filter(Boolean))].filter(i=>!(i in S.names));if(!ids.length)return;
  try{const ps=await S.user.profiles(ids);ids.forEach(i=>S.names[i]=(ps[i]&&ps[i].name)||'Alguém da equipe');if(S.view==='hist')render()}catch(e){}
}

/* ---------- unidades ---------- */
function viewUnits(){
  return `<div class="legend" style="margin-bottom:14px">Prazo de experiência por unidade: <b>Asa Sul, Delivery e Noroeste 30 + 60</b> · <b>demais 45 + 45</b>. </div>
  <div class="units">${UNITS.map(u=>`<div class="unit"><b>${esc(u.nome)}</b><span class="k">${esc(u.razao)} · ${u.tipo}</span><span class="cnpj">${u.cnpj}</span><span class="k">${esc(u.end)}</span><span class="exp">Experiência ${u.exp[0]} + ${u.exp[1]} dias</span>${u.act?'':'<span class="pill recriado">Sem ACT — só CCT</span>'}</div>`).join('')}</div>
  <section class="cat" style="margin-top:28px"><h2>Vale-transporte 2026<small>DF: R$ 11,00 por dia · Entorno: tarifa da linha × 2 · Noroeste e Matriz (CPD): + R$ 3,80 de circular · demais cidades: caso a caso</small></h2><div class="tbl-wrap"><table class="tb" style="min-width:480px"><thead><tr><th>Linha intermunicipal</th><th style="text-align:right">Tarifa</th><th style="text-align:right">Por dia (ida e volta)</th></tr></thead><tbody>${VT_ROTAS.map(([r,t])=>`<tr><td>${esc(r)}</td><td style="text-align:right">${brl(t)}</td><td style="text-align:right">${brl(t*2)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ================= Importar medidas anteriores (imagem, PDF ou Word) ================= */
const IMP={files:[],res:null,busy:false,msg:'',reg:true};
const loadScript=src=>new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Não consegui carregar o leitor de arquivos. Recarregue a página.'));document.head.appendChild(s)});
async function ensurePdf(){if(window.pdfjsLib)return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')}
async function ensureMammoth(){if(window.mammoth)return;await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js')}
function canvasBlob(c){return new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}
async function shrinkImage(file){
  const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  const k=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await canvasBlob(c)}finally{URL.revokeObjectURL(url)}
}
async function readForClaude(f){
  const nm=f.name.toLowerCase();
  if(f.type.startsWith('image/'))return {nome:f.name,images:[await shrinkImage(f)]};
  if(nm.endsWith('.pdf')){await ensurePdf();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let text='';const pages=Math.min(pdf.numPages,6);
    for(let i=1;i<=pages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n'}
    if(text.replace(/\s/g,'').length>120)return {nome:f.name,text};
    const imgs=[];for(let i=1;i<=Math.min(pages,3);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;imgs.push(await canvasBlob(c))}
    return {nome:f.name,images:imgs}}
  if(nm.endsWith('.docx')){await ensureMammoth();const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return {nome:f.name,text:r.value}}
  throw new Error(`"${f.name}": formato não suportado. Use foto (JPG/PNG), PDF ou Word (.docx).`);
}
function impHTML(){
  if(!S.sample)return `<span class="eyebrow">Importar medidas anteriores</span><span class="help">A leitura automática de documentos fica disponível ao abrir o portal pelo Claude, com sua conta. Enquanto isso, lance as medidas na lista abaixo.</span>`;
  const r=IMP.res;const al=linhaDe(S.data);
  return `<span class="eyebrow">Importar medidas anteriores</span>
  <span class="help">Envie as advertências e suspensões já aplicadas (foto, PDF ou Word). O Claude lê cada documento, identifica data, tipo, motivo, alínea e se está assinado, e separa o que é da mesma linha.</span>
  <input type="file" id="impFiles" multiple accept="image/*,.pdf,.docx" aria-label="Documentos das medidas anteriores">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn sm" id="impRun" ${IMP.busy||!IMP.files.length?'disabled':''}>${IMP.busy?'Lendo…':'Ler documentos'}</button><span class="help" id="impMsg">${esc(IMP.msg)}</span></div>
  ${r&&r.length?`<div class="tbl-wrap" style="border-radius:8px"><table class="tb" style="min-width:560px;font-size:12px"><thead><tr><th>Data</th><th>Medida</th><th>Motivo</th><th>Alínea</th><th>Assinada</th><th>Conta?</th></tr></thead><tbody>${r.map(m=>{const ok=m.alinea===al&&m.nivel!=='justa';return `<tr><td>${esc(br(m.data)||'?')}</td><td>${esc(NIVEL[m.nivel]||m.nivel)}</td><td>${esc(m.motivo||'')}${m.cpfDif?'<br><b style="color:var(--risk)">CPF diferente do formulário</b>':''}</td><td>${esc(m.alinea||'?')}</td><td>${m.assinada===true?'Sim':m.assinada===false?'Não':'Confirmar'}</td><td>${ok?(m.assinada===true?'Sim, mesma linha':'Mesma linha, mas só conta assinada'):'Não, outra linha'}</td></tr>`}).join('')}</tbody></table></div>
  <label class="chk"><input type="checkbox" id="impReg" ${IMP.reg?'checked':''}> Registrar também no histórico do portal</label>
  <button type="button" class="btn sm primary" id="impAdd" style="width:fit-content">Adicionar as da mesma linha à lista</button>`:''}`;
}
function paintImp(){const b=$('#impBox');if(b)b.innerHTML=impHTML()}
async function runImport(){
  if(!S.sample||!IMP.files.length)return;IMP.busy=true;IMP.msg='Preparando os arquivos…';paintImp();
  try{
    const lidos=[];for(const f of IMP.files)lidos.push(await readForClaude(f));
    let images=lidos.flatMap(x=>x.images||[]);const lim=S.sampleLim&&S.sampleLim.images;
    if(images.length&&!lim)throw new Error('Esta visualização não permite enviar imagens ao Claude. Use PDF com texto ou Word.');
    let aviso='';if(lim&&images.length>lim.maxCount){images=images.slice(0,lim.maxCount);aviso=` Só as ${lim.maxCount} primeiras imagens foram lidas.`}
    const textos=lidos.filter(x=>x.text).map(x=>`### Arquivo: ${x.nome}\n${x.text.slice(0,12000)}`).join('\n\n');
    const nomesImg=lidos.filter(x=>x.images).map(x=>x.nome).join(', ');
    IMP.msg='O Claude está lendo os documentos…';paintImp();
    const prompt=`Você ajuda o Departamento Pessoal de um restaurante no Brasil. Recebe documentos de medidas disciplinares JÁ APLICADAS a um colaborador (advertência verbal, advertência escrita, suspensão).${textos?`\n\nTexto extraído:\n${textos}`:''}${nomesImg?`\n\nImagens anexas (fotos/digitalizações): ${nomesImg}.`:''}

Extraia CADA medida (um documento pode citar medidas anteriores no histórico; inclua também essas, sem duplicar). Responda APENAS com JSON:
{"medidas":[{"data":"AAAA-MM-DD","nivel":"verbal|escrita|suspensao|justa","dias":número ou null,"motivo":"texto curto começando com 'por', citando as datas da falta, ex.: 'por falta injustificada no dia 24 de outubro de 2025'","alinea":"letra do art. 482 da CLT","assinada":true|false|null,"cpf":"só dígitos ou vazio"}]}
Regras: "data" é a data de aplicação da medida (data do documento), não a data da falta. "Advertência ao Empregado" com Ref ADVERTÊNCIA = "escrita"; "Advertência Verbal" = "verbal"; Suspensão = "suspensao" (em "dias" o número de dias; no motivo comece com "(de N dia(s))"). Alínea: falta ou atraso injustificado = "e" (desídia); saída do posto sem autorização, descumprimento de ordem ou norma = "h" (indisciplina/insubordinação); outras condutas, a alínea mais adequada. "assinada": true só se a imagem mostrar assinatura do empregado ou o "Ciente em" preenchido; false se estiver em branco; null quando só há texto extraído sem imagem.`;
    const out=await S.sample.json(prompt,{images:images.length?images:undefined,modelTier:'default'});
    const cpf=digits(S.data.cpf);
    IMP.res=(out&&out.medidas||[]).filter(m=>m&&m.data&&m.nivel).map(m=>({...m,alinea:String(m.alinea||'').toLowerCase().replace(/[^a-m]/g,'').slice(0,1),cpfDif:!!(cpf&&m.cpf&&digits(m.cpf)!==cpf)})).sort((a,b)=>String(a.data).localeCompare(String(b.data)));
    IMP.msg=IMP.res.length?`Encontrei ${IMP.res.length} medida(s). Confira antes de adicionar.${aviso}`:'Não encontrei medidas nesses arquivos.';
  }catch(e){IMP.msg=e&&e.code==='not_granted'?'Leitura não autorizada. Lance as medidas manualmente na lista.':e&&e.code==='rate_limited'?'Muitas leituras seguidas. Aguarde um minuto e tente de novo.':(e&&e.message)||'Não consegui ler os documentos.'}
  IMP.busy=false;paintImp();
}
async function addImport(){
  const al=linhaDe(S.data);const sel=(IMP.res||[]).filter(m=>m.alinea===al&&['verbal','escrita','suspensao'].includes(m.nivel));
  if(!sel.length){IMP.msg='Nenhuma medida da mesma linha para adicionar.';paintImp();return}
  const arr=S.data.anteriores=S.data.anteriores||[];
  sel.forEach(m=>{if(!arr.some(r=>r.data===m.data&&r.nivel===m.nivel))arr.push({data:m.data,nivel:m.nivel,motivo:m.motivo||'',assinada:m.assinada===true?'sim':'nao'})});
  arr.sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  if(IMP.reg&&S.db){for(const m of sel){if(S.hist.some(h=>h.tpl==='medida'&&h.cpf===digits(S.data.cpf)&&h.dataRef===m.data&&h.nivel===m.nivel))continue;
    try{await S.db.collection('documentos').add({tpl:'medida',titulo:NIVEL[m.nivel],nome:String(S.data.nome||'').trim().toUpperCase(),cpf:digits(S.data.cpf),unidade:S.data.unidade||'',dataRef:m.data,criadoEm:new Date().toISOString(),por:S.uid||'',nivel:m.nivel,linha:m.alinea,status:m.assinada===true?'assinada':'aguardando',origem:'importada',dados:{unidade:S.data.unidade||'',nome:S.data.nome||'',cpf:S.data.cpf||'',infracao:S.data.infracao,relato:m.motivo||''}})}catch(e){}}}
  IMP.msg=`${sel.length} medida(s) adicionada(s). As marcadas "Não" em assinada não contam para a escala até você confirmar.`;
  rerenderForm();paintPreview();
}

/* ================= Boot ================= */
render();
(async()=>{
  const cl=window.claude;if(!cl||!cl.use){S.histReady=true;const th=$('#tab-hist');if(th)th.hidden=true;if(S.view==='hist')render();return}
  const [db,dl,user,sample]=await Promise.all([cl.use('db'),cl.use('downloads'),cl.use('user'),cl.use('sample')]);
  S.sample=sample;if(sample){try{S.sampleLim=await sample.limits()}catch(e){}}if(S.view==='editor'&&S.tpl==='medida')paintImp();
  S.db=db;S.dl=dl;S.user=user;S.histReady=true;
  if(user){try{S.uid=await user.id()}catch(e){}}
  if(db){db.collection('documentos').orderBy('criadoEm','desc').limit(500).onSnapshot(snap=>{S.hist=snap.docs.map(x=>({_id:x.id,...x.data()}));resolveNames();if(S.view==='hist')render();else if(S.view==='editor'&&S.tpl==='medida')refreshCalc()},e=>toast('Histórico desconectado ('+(e.code||'erro')+'). Recarregue a página.'))}
  if(S.view==='hist')render();
})();
</script>
