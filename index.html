<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Base de Documentos RH Almeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=Carlito:ital,wght@0,400;0,700;1,400&family=Noto+Serif:wght@400;700&family=Tinos:wght@400;700&family=Arimo:wght@400;700&display=swap">
<style>
/* Layout: biblioteca de modelos -> editor em duas colunas (formulário | folha A4 ao vivo). A folha é sempre papel branco. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#14213A; --muted:#5A6678; --line:#D8DEE7;
  --brand:#1B365D; --brand-ink:#FFFFFF; --accent:#2D6CB0; --focus:#2D6CB0;
  --ok:#1E7A4F; --ok-bg:#E3F3EA; --warn:#8A5A00; --warn-bg:#FCF1D6; --risk:#A23B2A; --risk-bg:#FBE6E1;
  --paper:#FFFFFF; --paper-ink:#111111; --desk:#DCE2EA;
  --f-display:'Archivo','Arial Narrow',Arial,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-doc:'Carlito','Calibri','Liberation Sans',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#161F2E; --surface-2:#1B2638; --ink:#E5EBF3; --muted:#9AA7B9; --line:#2B374A;
  --brand:#9CC0EA; --brand-ink:#0E1420; --accent:#8DB6E6; --focus:#8DB6E6;
  --ok:#7FD3A6; --ok-bg:#163326; --warn:#F0C66B; --warn-bg:#3A2E12; --risk:#F2A08F; --risk-bg:#3B1E18;
  --paper:#FFFFFF; --paper-ink:#111111; --desk:#0A0F18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161F2E; --surface-2:#1B2638; --ink:#E5EBF3; --muted:#9AA7B9; --line:#2B374A;
  --brand:#9CC0EA; --brand-ink:#0E1420; --accent:#8DB6E6; --focus:#8DB6E6;
  --ok:#7FD3A6; --ok-bg:#163326; --warn:#F0C66B; --warn-bg:#3A2E12; --risk:#F2A08F; --risk-bg:#3B1E18;
  --paper:#FFFFFF; --paper-ink:#111111; --desk:#0A0F18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:0 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{font:600 13px var(--f-body);border:1px solid transparent;background:none;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);border-color:var(--line)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* biblioteca */
.lib{display:grid;gap:28px}
.cat h2{font-family:var(--f-display);font-size:16px;margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
.cat h2 small{font:500 12px var(--f-body);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card b{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.card p{margin:0;color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-body);padding:2px 8px;border-radius:99px;width:fit-content}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.oficial{background:var(--ok-bg);color:var(--ok)}
.pill.recriado{background:var(--warn-bg);color:var(--warn)}
.pill.provisorio,.pill.base{background:var(--warn-bg);color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--muted)}
/* editor */
.editor{display:grid;grid-template-columns:minmax(330px,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.editor{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.panel-h h2{font-family:var(--f-display);font-size:18px;margin:0;text-wrap:balance}
.panel-h .note{font-size:12.5px;color:var(--muted)}
form.fm{padding:6px 16px 16px;display:grid;gap:4px}
fieldset{border:0;padding:12px 0 6px;margin:0;border-top:1px solid var(--line);display:grid;gap:10px}
fieldset:first-child{border-top:0}
legend{padding:0;margin-bottom:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row>.fld.full{grid-column:1/-1}
@media (max-width:460px){.row{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.fld .help{font-size:11.5px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.fld .chk input{margin-top:3px;width:auto;flex:none}
.lst{display:grid;gap:6px}
.lst .li{display:grid;gap:6px;align-items:end;grid-template-columns:var(--cols) 30px}
.lst .li input,.lst .li select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 7px;width:100%;min-width:0;font-size:13px}
.lst .hd{font-size:11px;font-weight:600;color:var(--muted)}
.x{border:1px solid var(--line);background:none;border-radius:6px;height:31px;cursor:pointer;color:var(--muted)}
.calc{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:5px;font-size:12.5px}
.calc div{display:flex;justify-content:space-between;gap:10px}
.calc div span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.alert{border-radius:8px;padding:9px 12px;font-size:12.5px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.risk{background:var(--risk-bg);color:var(--risk)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;border-radius:0 0 10px 10px}
.msg{font-size:12.5px;color:var(--muted);width:100%}
.prev-wrap{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.prev-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.desk{background:var(--desk);border-radius:10px;padding:18px;max-height:calc(100vh - 90px);overflow:auto}
.scaler{transform-origin:top left}
.sheet{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);padding:48px 58px;box-shadow:0 1px 3px rgba(0,0,0,.18);margin-bottom:18px}
.sheet[contenteditable="true"]{outline:2px dashed var(--accent);outline-offset:-6px}
.sheet .ph{background:#FFF1B8;color:#6B5200;border-radius:2px;padding:0 2px}
/* histórico / unidades */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.tb{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
table.tb th{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.tb td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
table.tb select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.unit b{font-family:var(--f-display);font-size:15px}
.unit .k{font-size:12.5px;color:var(--muted)}
.unit .cnpj{font-variant-numeric:tabular-nums;font-weight:600}
.exp{font:700 12px var(--f-body);padding:3px 9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);width:fit-content}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s}}

/* ===== Documento (papel) — padrão visual dos modelos Word do RH ===== */
.docw{font-family:var(--f-doc);font-size:12px;line-height:1.36;color:#111;width:100%}
.docw h1{font-family:var(--f-doc);font-size:16.5px;color:#1B365D;text-align:center;font-weight:700;margin:0 0 14px;text-transform:uppercase;letter-spacing:0}
.docw h3{font-size:12.5px;color:#1B365D;margin:14px 0 6px;text-transform:uppercase}
.docw table.hd{width:100%;border-collapse:collapse;margin:0 0 14px}
.docw table.hd td{border:1px solid #D3D3D3;padding:5px 8px;font-size:11px;vertical-align:top}
.docw table.hd td.l{background:#F0F4F8;color:#1B365D;font-weight:700;width:33%;text-transform:uppercase}
.docw p{margin:0 0 9px;text-align:justify}
.docw .cl{margin:0 0 7px;text-align:justify}
.docw .cl b{color:#1B365D}
.docw .opt{margin:0 0 4px 22px}
.docw .box{border:1px solid #1B365D;background:#F9FAFC;padding:8px 10px;margin:12px 0;font-size:11px;line-height:1.45}
.docw .box .t{color:#1B365D;font-weight:700}
.docw .date{text-align:right;font-weight:700;margin:18px 0 0}
.docw .sigs{display:grid;grid-template-columns:1fr 1fr;column-gap:48px;row-gap:46px;margin-top:52px;text-align:center;font-size:11px}
.docw .sig .ln{border-top:1px solid #111;margin:0 10px 3px}
.docw .sig .sm{font-size:10.5px}
.docw table.it{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:11px}
.docw table.it th{background:#F0F4F8;color:#1B365D;text-align:left;border:1px solid #D3D3D3;padding:5px 7px;text-transform:uppercase;font-size:10.5px}
.docw table.it td{border:1px solid #D3D3D3;padding:5px 7px}
.docw .draft{border:1px dashed #B5452F;color:#8C2F1C;font-size:10px;padding:4px 8px;margin:0 0 12px;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.docw .sub{margin-top:26px;padding-top:14px;border-top:1px solid #D3D3D3}
.docw .ln{border-top:1px solid #111;margin:0 0 3px}
.docw .ctr{text-align:center}
.docw .tight{text-align:left;line-height:1.5}
.docw .sg2{display:grid;grid-template-columns:1fr 1fr;column-gap:46px;row-gap:46px;margin-top:50px;text-align:center}
/* contrato de experiência — Noto Serif 12pt */
.docw.ct{font-family:'Noto Serif',Georgia,serif;font-size:14.5px;line-height:1.5}
.docw.ct h2{text-align:center;font-size:15px;margin:0 0 22px;font-weight:700}
.docw.ct p{margin:0 0 12px}
.docw.ct .sg2{font-size:13px}
/* premiação (RHAY) */
.docw.pr{font-family:'Arimo',Arial,sans-serif;font-size:12.5px;line-height:1.55}
.docw.pr h2{text-align:center;font-size:15px;margin:10px 0 10px}
.docw.pr h4{font-size:12.5px;margin:16px 0 6px}
.docw.pr p{margin:0 0 9px}
/* aditivo cargo/salário (Wine Garden) */
.docw.ad{font-family:'Arimo',Arial,sans-serif;font-size:11px;line-height:1.45}
.docw.ad h2{text-align:center;font-size:12px;margin:0 0 10px}
.docw.ad .ctr{margin:2px 0 8px}
/* aditivo cargo de confiança */
.docw.cf{font-family:'Carlito','Calibri',sans-serif;font-size:12.5px;line-height:1.42}
.docw.cf h2{text-align:center;font-size:14px;margin:0 0 10px}
.docw.cf h4{font-size:12.5px;margin:10px 0 3px}
.docw.cf p{margin:0 0 6px}
/* função e jornada — Times */
.docw.es{font-family:'Tinos','Times New Roman',serif;font-size:14.5px;line-height:1.38}
.docw.es h2{text-align:center;font-size:16px;margin:0 0 16px}
.docw.es p{margin:0 0 13px}
/* documentos do sistema de folha */
.docw.sys{font-family:'Arimo',Arial,sans-serif;font-size:10.5px;line-height:1.45}
.docw.sys .st{text-align:center;font-weight:700;font-size:11.5px;margin:0 0 20px}
.docw.sys .ind{text-indent:48px}
.docw.sys table.dias{border-collapse:collapse;width:80%;margin:6px 0 10px;font-size:10.5px}
.docw.sys table.dias th{text-align:left;border-bottom:1px solid #111;padding:2px 6px}
.docw.sys table.dias td{padding:2px 6px}
.docw.sys.lg{font-size:11.5px;line-height:1.5}
.docw.sys.lg p{margin:0 0 7px;text-align:justify}
.docw.sys.lg .opt{margin-left:18px}
.docw.sys table.dias td{border-bottom:1px solid #ddd}
.docw.sys.bh{font-size:12px;line-height:1.6}
.docw.sys.bh p{margin:0 0 10px}
.docw.sys.bh table.hd td{padding:3px 7px;font-size:10px}
.docw.sys.vt{font-size:11.5px;line-height:1.5}
.docw.sys.vt p{margin:0 0 7px;text-align:justify}
.docw.fr{font-family:'Arimo',Arial,sans-serif;color:#111;font-size:9px}
.docw.fr .bx{border:1px solid #333;border-radius:6px;margin-bottom:4px;overflow:hidden}
.docw.fr .fl{display:flex;gap:4px;margin-bottom:4px}.docw.fr .fl>.bx{margin:0}
.docw.fr .tit{font-weight:700;font-size:13px;text-align:center;padding:3px}
.docw.fr .r{display:flex}.docw.fr .r+.r{border-top:1px solid #333}
.docw.fr .c{flex:1;min-width:0;padding:1px 5px 2px;border-right:1px solid #333;min-height:24px}.docw.fr .c:last-child{border-right:0}
.docw.fr .lb{display:block;font-size:6.5px;line-height:1.25}
.docw.fr .vl{font-size:9.5px;line-height:1.25;padding-left:6px;overflow-wrap:anywhere}
.docw.fr .t{text-align:center;font-size:7px;padding:2px;border-bottom:1px solid #333}
.docw.fr .foto{flex:0 0 15%;display:flex;align-items:center;justify-content:center;font-size:7px;color:#777}
.docw.gd{font-family:'Arimo',Arial,sans-serif;color:#10243a;font-size:12.4px;line-height:1.45;position:relative;min-height:1010px}
.docw.gd .gtop{border-top:1px solid #b8681f;margin-bottom:22px}
.docw.gd .glogo{text-align:center}.docw.gd .glogo img{width:118px}
.docw.gd h2{text-align:center;font-size:20px;margin:2px 0 0;color:#10243a}
.docw.gd .gsub{text-align:center;color:#5c6a78;font-size:12px;margin:2px 0 14px}
.docw.gd .gtb{width:100%;border-collapse:collapse;border:1px solid #ddd4c8;margin-bottom:16px}
.docw.gd .gtb td{border:1px solid #ddd4c8;padding:8px 8px;font-size:12px;height:34px}
.docw.gd .gtb td.gl{background:#f6f3ee;color:#5c6a78;font-size:10px;width:16%}
.docw.gd .gint{display:flex;gap:18px;align-items:flex-start}.docw.gd .gint p{margin:0;text-align:justify;flex:1}
.docw.gd .gurl{color:#b8681f}
.docw.gd .gqr{flex:0 0 74px;text-align:center;font-size:9px;color:#5c6a78}.docw.gd .gqr img{width:72px;display:block;margin:0 auto 4px}
.docw.gd .gul{margin:12px 0 0;padding-left:16px;font-size:12px;line-height:1.42}.docw.gd .gul li{margin-bottom:2px;text-align:justify}
.docw.gd .gft{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:10px;color:#5c6a78}
.docw.gd .gch{color:#b8681f;font-weight:700;margin-bottom:4px}
.docw.gd .gcols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;font-size:11.5px;line-height:1.55}
.docw.gd .gp{text-align:justify;margin:18px 0 0}
.docw.gd .gsig{display:grid;grid-template-columns:1fr 1fr;gap:56px 70px;margin-top:70px;text-align:center;font-size:11.5px}
.docw.gd .gsig .ln{border-top:1px solid #10243a;margin-bottom:6px}.docw.gd .gsig span{display:block;color:#5c6a78;font-size:10px}
/* uniformes — papel timbrado */
.docw.un{position:relative;min-height:1010px;font-family:'Arimo',Arial,sans-serif;font-size:13.5px;line-height:1.4;overflow:hidden}
.docw.un>*{position:relative;z-index:1}
.docw.un .wm{position:absolute;z-index:0;max-width:none}
.docw.un .w1{right:-6px;top:0;width:30%}
.docw.un .w2{right:-6px;top:15.6%;width:30%}
.docw.un .w3{left:-6px;bottom:0;width:48%}
.docw.un .w4{left:58%;bottom:5%;width:31%}
.docw.un .ulogo{color:#11284a;font-size:20px;letter-spacing:.3em;line-height:1.5;margin:10px 0 18px}
.docw.un .utit{color:#11284a;font-size:18px;letter-spacing:.18em;text-align:center;padding-bottom:10px;border-bottom:1px solid #11284a;margin:0 8% 34px}
.docw.un p{text-align:justify;margin:0 0 10px}
.docw.un .jt{display:block;text-align:justify;text-align-last:justify}
.docw.un .emps{line-height:1.6}
.docw.un table.upr{border-collapse:collapse;margin:16px 0 26px 5%;font-size:13px;background:#fff}
.docw.un table.upr td{border:1px solid #111;padding:0 8px;min-width:120px}
.docw.un table.upr td:first-child{text-align:center;min-width:160px}
.docw.un table.uit{border-collapse:collapse;width:96%;margin:0 auto 70px;font-size:13px;background:#fff}
.docw.un table.uit th{font-weight:400;border:1px solid #111;padding:1px 6px}
.docw.un table.uit td{border:1px solid #111;padding:3px 6px;text-align:center;height:24px}
.docw.un .usig{width:72%;margin:0 auto 40px;text-align:center;font-size:9px}
.docw.un .usig .nm{font-size:13px;min-height:18px}
.docw.pd{font-family:'Arimo',Arial,sans-serif;font-size:14px;line-height:1.6}
.docw.pd h2{text-align:center;font-size:16px;margin:0 0 18px}
.docw.pd .ind{text-indent:40px}
.docw.pd ul{margin:0 0 12px 30px}
.docw.pd .rcb{margin-top:80px;padding-top:10px;border-top:1px dashed #999;font-size:11px;color:#333}
/* medida disciplinar — modelo Wine Garden */

  if(isNaN(n))return '';
  const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];

function docUnif(d,u,tipo){

function vtCalc(d){
  const u=unitOf(d.unidade);const circ=!!(d.vtCircular&&u&&VT_CIRC_UNITS.includes(u.id));
  if(d.optaVT==='nao')return {ok:true,dia:0,linhas:[],nota:'Não optante.'};
  if(d.vtRegiao==='df'){const l=[['Residência no DF — valor padrão da empresa (ida e volta)',VT_DF]];if(circ)l.push(['Circular de madrugada até a Rodoviária (exceção '+u.nome+')',VT_CIRCULAR]);return {ok:true,linhas:l,dia:l.reduce((a,x)=>a+x[1],0)}}
  if(d.vtRegiao==='entorno'){const r=VT_ROTAS.find(x=>x[0]===d.vtRota);if(!r)return {ok:false,nota:'Escolha a linha do Entorno.'};const l=[[`${r[0]} — ida (${brl(r[1])})`,r[1]],[`${r[0]} — volta (${brl(r[1])})`,r[1]]];if(circ)l.push(['Circular de madrugada até a Rodoviária (exceção '+u.nome+')',VT_CIRCULAR]);return {ok:true,linhas:l,dia:l.reduce((a,x)=>a+x[1],0)}}
  if(d.vtRegiao==='outra'){const n=num(d.vtValorManual);if(isNaN(n))return {ok:false,nota:'Cidade fora da tabela: análise caso a caso. Informe o valor diário aprovado.'};return {ok:true,linhas:[[`Valor aprovado caso a caso (${d.vtCidadeOutra||'cidade não listada'})`,n]],dia:n,caso:true}}
  return {ok:false,nota:'Informe onde o colaborador mora.'};
}
function calcVT(d){
  const u=unitOf(d.unidade);const c=vtCalc(d);const out=[];
  if(c.ok&&c.dia)out.push(['Valor diário de VT',brl(c.dia)],['Estimativa mensal (26 dias)',brl(c.dia*26)]);
  if(!c.ok)out.push(['__warn',c.nota]);
  if(c.caso)out.push(['__warn','Cidade fora da tabela do Entorno: valor definido caso a caso. Guarde a aprovação.']);
  if(d.vtCircular&&!(u&&VT_CIRC_UNITS.includes(u.id)))out.push(['__warn','A circular de R$ 3,80 só vale para quem é registrado no Noroeste ou na Matriz (CPD).']);
  if(/12x36/i.test(d.escala||''))out.push(['Desconto máximo','3% do salário-base (12x36, CCT cl. 9ª § 7º)']);
  return out;
}

  <p class="tight">( ${op==='sim'?'X':'&nbsp;&nbsp;'} ) OPTO pela utilização do vale-transporte.<br>( ${op==='nao'?'X':'&nbsp;&nbsp;'} ) NÃO OPTO pela utilização do vale-transporte, por não necessitar de transporte coletivo para o deslocamento residência–trabalho e vice-versa.</p>
  <p><b>1. Endereço residencial:</b> ${v(d.endereco,'endereço completo')}${d.cep?', CEP '+esc(d.cep):''} — Localidade: ${reg}.</p>
  <p><b>2. Meios de transporte</b> coletivo público mais adequados ao meu deslocamento residência–trabalho e vice-versa${d.vtIda?': '+esc(d.vtIda):''}:</p>
  ${op==='nao'?'':`<table class="dias" style="width:100%"><tr><th>Trecho</th><th style="text-align:right">Valor</th></tr>${c.ok?c.linhas.map(([a,b])=>`<tr><td>${esc(a)}</td><td style="text-align:right">${brl(b)}</td></tr>`).join('')+`<tr><td><b>Valor diário do vale-transporte</b></td><td style="text-align:right"><b>${brl(c.dia)}</b></td></tr>`:`<tr><td colspan="2">${v('','preencha a localidade e a linha','_____________________________________________')}</td></tr>`}</table>`}
  <p><b>3. Compromissos.</b> Comprometo-me a:</p>
  <p class="opt">a) utilizar o vale-transporte exclusivamente para o meu efetivo deslocamento residência–trabalho e vice-versa, nos dias de trabalho efetivo;</p>
  <p class="opt">b) atualizar esta declaração anualmente e sempre que houver alteração do meu endereço residencial ou dos serviços e meios de transporte, sob pena de suspensão do benefício até a regularização;</p>
  <p class="opt">c) não receber o benefício nos dias de falta, folga, férias, afastamentos, licenças ou trabalho em regime remoto, autorizando a compensação dos valores pagos a maior no período seguinte ou nas verbas rescisórias.</p>
  <p><b>4. Desconto.</b> Autorizo o desconto mensal de até ${/12x36/i.test(d.escala||'')?'3% (três por cento), por estar em escala 12x36 (CCT 2026/2028, cl. 9ª, § 7º),':'6% (seis por cento)'} do meu salário-base para custeio do benefício (Lei nº 7.418/1985, art. 4º, parágrafo único; CCT 2026/2028, cl. 7ª), limitado ao valor efetivamente concedido no mês.</p>
  <p><b>5. Forma de pagamento.</b> Estou ciente de que o benefício poderá ser concedido em cartão ou em dinheiro, por depósito ou transferência para conta de minha titularidade, sem natureza salarial, conforme a Cláusula Quinta do Acordo Coletivo de Trabalho do Grupo Almeria, e que o valor diário segue a política da empresa: residentes no DF, ${brl(VT_DF)} por dia; residentes no Entorno, a tarifa vigente da linha intermunicipal indicada, conforme tabela de 2026; demais localidades, análise caso a caso.</p>
  <p><b>6. Declaração falsa.</b> Declaro estar ciente de que a declaração falsa ou o uso indevido do vale-transporte constitui falta grave, podendo ensejar a rescisão do contrato por justa causa (art. 482, "a", da CLT), sem prejuízo da devolução dos valores recebidos indevidamente.</p>
  <p style="text-align:right;margin-top:12px">Brasília/DF, ${dLine(d)}.</p>
  <div class="sg2" style="margin-top:38px"><div><div class="ln"></div>${up(d.nome,'NOME')}<br>Empregado(a)</div><div><div class="ln"></div>${razao(u)}<br>Empregador</div></div></div>`;
}

/* ======== Declaração de dependentes para IRRF ======== */
function docIR(d,u){
  const deps=(d.depIR||[]).filter(r=>r.nome);
  return `<div class="docw sys lg"><div class="st">DECLARAÇÃO DE DEPENDENTES PARA FINS DE IMPOSTO DE RENDA RETIDO NA FONTE</div>
  ${H.hd([['Empregador:',razao(u)],['CNPJ:',cnpj(u)],['Empregado(a):',up(d.nome,'NOME')],['CPF:',v(fmtCPF(d.cpf),'CPF')],['CTPS / Série:',`${v(d.ctps,'CTPS','______')} / ${v(d.ctpsSerie,'série','____')}`],['Estado civil:',v(d.estadoCivil,'estado civil')],['Endereço:',`${v(d.endereco,'endereço')}${d.cep?', CEP '+esc(d.cep):''}${d.cidade?' — '+esc(d.cidade):''}`]])}
  <p>Para fins de dedução na base de cálculo do Imposto de Renda Retido na Fonte (Lei nº 9.250/1995, art. 4º, III, e art. 35; Regulamento do Imposto de Renda — Decreto nº 9.580/2018), DECLARO, sob as penas da lei:</p>
  <p class="tight">( ${deps.length?'&nbsp;&nbsp;':'X'} ) que NÃO possuo dependentes para fins de Imposto de Renda;<br>( ${deps.length?'X':'&nbsp;&nbsp;'} ) que possuo os dependentes abaixo relacionados, os quais se enquadram nas hipóteses do art. 35 da Lei nº 9.250/1995:</p>
  <table class="dias" style="width:100%"><tr><th>Nome completo do dependente</th><th>Parentesco</th><th>Nascimento</th><th>CPF</th></tr>${(deps.length?deps:[{},{},{}]).map(r=>`<tr><td>${esc(r.nome||'')}&nbsp;</td><td>${esc(r.par||'')}</td><td>${esc(br(r.nasc))}</td><td>${esc(fmtCPF(r.cpf||''))}</td></tr>`).join('')}</table>
  <p>Declaro ainda que:</p>
  <p class="opt">a) os dependentes acima não são considerados, ao mesmo tempo, como dependentes de outro contribuinte, inclusive do outro cônjuge ou companheiro(a), para fins de retenção na fonte;</p>
  <p class="opt">b) comunicarei por escrito ao Departamento Pessoal, no prazo de até 5 (cinco) dias, qualquer alteração (inclusão, exclusão, óbito, maioridade, emancipação, término de curso, mudança de guarda ou de dependência econômica), ciente de que a empresa aplicará a dedução exclusivamente com base nas informações aqui prestadas;</p>
  <p class="opt">c) assumo integral responsabilidade pela veracidade destas informações, isentando o EMPREGADOR (fonte pagadora) de qualquer responsabilidade perante a Receita Federal, e estou ciente de que a declaração falsa sujeita o declarante às sanções do art. 299 do Código Penal e às penalidades da legislação tributária;</p>
  <p class="opt">d) autorizo o EMPREGADOR a recalcular o imposto e descontar de minha remuneração ou das verbas rescisórias eventuais diferenças de IRRF decorrentes de informação incorreta ou não comunicada;</p>
  <p class="opt">e) autorizo o tratamento dos dados pessoais dos dependentes informados exclusivamente para cumprimento de obrigações legais (eSocial, EFD-Reinf, DIRF e Informe de Rendimentos), nos termos do art. 7º, II, da Lei nº 13.709/2018 (LGPD), e declaro ter legitimidade para fornecê-los.</p>
  <p style="margin-top:12px">Brasília/DF, ${dLine(d)}.</p>
  <div class="sg2" style="margin-top:40px"><div><div class="ln"></div>${up(d.nome,'NOME')}<br>Declarante</div><div><div class="ln"></div>Ciente do cônjuge/companheiro(a) (quando houver)<br>IN RFB nº 1.500/2014, art. 90, § 6º</div></div>
  <p style="text-align:center;margin-top:18px;font-size:9.5px">Esta declaração deve ser renovada sempre que houver alteração nas informações prestadas.</p></div>`;
}

/* ======== Termo de responsabilidade — salário-família ======== */

  ${H.hd([['Empregador:',razao(u)],['CNPJ:',cnpj(u)],['Segurado(a):',up(d.nome,'NOME')],['CPF:',v(fmtCPF(d.cpf),'CPF')],['CTPS / Série:',`${v(d.ctps,'CTPS','______')} / ${v(d.ctpsSerie,'série','____')}`]])}
  <p class="tight">Pelo presente termo, DECLARO, sob as penas da lei:<br>( ${deps.length?'&nbsp;&nbsp;':'X'} ) que NÃO possuo filhos ou equiparados que me deem direito ao salário-família;<br>( ${deps.length?'X':'&nbsp;&nbsp;'} ) que possuo os filhos ou equiparados abaixo, menores de 14 (quatorze) anos ou inválidos de qualquer idade:</p>

  <p>Estou ciente e de acordo que:</p>

  <p class="opt">b) para a manutenção do benefício, entregarei anualmente o atestado de vacinação obrigatória dos filhos de até 6 (seis) anos e, semestralmente, o comprovante de frequência escolar dos filhos a partir de 4 (quatro) anos, nos termos do art. 67 da Lei nº 8.213/1991, ciente de que a falta de entrega suspende o pagamento;</p>
  <p class="opt">c) comunicarei por escrito ao Departamento Pessoal, imediatamente, qualquer fato que implique a cessação do benefício, como óbito do filho, perda da guarda ou da condição de equiparado, cessação da invalidez ou alteração de dados;</p>
  <p class="opt">d) a falta de cumprimento do compromisso ora assumido, além de obrigar à devolução das importâncias recebidas indevidamente, autoriza o EMPREGADOR a descontá-las de minha remuneração ou das verbas rescisórias e sujeita-me às penalidades previstas no art. 171 do Código Penal e à rescisão do contrato de trabalho por justa causa, nos termos do art. 482 da Consolidação das Leis do Trabalho;</p>
  <p class="opt">e) autorizo o tratamento dos dados pessoais dos dependentes informados exclusivamente para a concessão do benefício e o cumprimento de obrigações legais (eSocial), nos termos do art. 7º, II, da Lei nº 13.709/2018 (LGPD).</p>
  <p style="margin-top:12px">Brasília/DF, ${dLine(d)}.</p>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px;gap:30px"><div style="flex:1;text-align:center"><div class="ln"></div>${up(d.nome,'NOME')}<br>Segurado(a)</div><div style="width:100px;height:100px;border:1px solid #999;display:flex;align-items:flex-end;justify-content:center;font-size:9px;padding-bottom:4px">Impressão Digital</div></div>
  <div style="width:55%;margin-top:34px;text-align:center"><div class="ln"></div>Recebido pelo Departamento Pessoal</div></div>`;
}

/* ======== Acordo individual de prorrogação e compensação (banco de horas) ======== */
function docBH(d,u){
  const cl=(n,t,body)=>`<p><b>CLÁUSULA ${n} – ${t}.</b> ${body}</p>`;
  return `<div class="docw sys lg bh"><div class="st">ACORDO INDIVIDUAL DE BANCO DE HORAS</div>
  ${H.hd([['Empregador / CNPJ:',`${razao(u)} — ${cnpj(u)}`],['Empregado(a) / CPF:',`${up(d.nome,'NOME')} — ${v(fmtCPF(d.cpf),'CPF')}`],['Cargo / Admissão:',`${up(d.cargo,'CARGO')} — ${vd(d.admissao)}`]])}
  <p>As partes acima qualificadas, com fundamento no art. 59, §§ 2º e 5º, e no art. 611-A, II, da Consolidação das Leis do Trabalho, e nas normas do Acordo Coletivo de Trabalho e da Convenção Coletiva de Trabalho vigentes, celebram o presente acordo de banco de horas, mediante as cláusulas a seguir.</p>
  ${cl('PRIMEIRA','DA JORNADA','A jornada de trabalho do(a) EMPREGADO(A) é a estabelecida em seu contrato de trabalho, respeitado o limite de 220 (duzentas e vinte) horas mensais, podendo ser variável e organizada em escala definida pela gerência, inclusive em regime 12x36, conforme as normas coletivas vigentes. O(A) EMPREGADO(A) declara estar ciente de que a escala de trabalho é encaminhada pelo gerente nos grupos oficiais de comunicação da equipe.')}
  ${cl('SEGUNDA','DO BANCO DE HORAS','As horas trabalhadas além da jornada serão lançadas em banco de horas e compensadas por meio de folgas, redução da jornada em outro dia, entradas posteriores ou saídas antecipadas, no prazo de compensação previsto no Acordo Coletivo e na Convenção Coletiva de Trabalho vigentes. As horas não compensadas nesse prazo serão pagas como horas extras, na forma das mesmas normas.')}
  ${cl('TERCEIRA','DA AUTORIZAÇÃO','A realização de horas extras depende de autorização prévia do superior imediato. O(A) EMPREGADO(A) concorda em prestar horas extras sempre que solicitado(a) pelo gerente, dentro dos limites legais, e somente as horas previamente autorizadas serão consideradas para o banco de horas.')}
  ${cl('QUARTA','DA TRANSPARÊNCIA','O saldo do banco de horas será apurado com base no registro de ponto e informado periodicamente ao(à) EMPREGADO(A).')}
  ${cl('QUINTA','DAS DISPOSIÇÕES GERAIS','Aplicam-se a este acordo as demais condições previstas no Acordo Coletivo e na Convenção Coletiva de Trabalho vigentes, que o integram para todos os efeitos. O presente acordo vigora por prazo indeterminado.')}
  <p>E, por estarem de acordo, as partes assinam o presente em 2 (duas) vias de igual teor.</p>
  <p style="margin-top:14px">Brasília/DF, ${dLine(d)}.</p>
  <div class="sg2" style="margin-top:46px"><div><div class="ln"></div>${up(d.nome,'NOME')}<br>Empregado(a)</div><div><div class="ln"></div>${razao(u)}<br>Empregador</div><div><div class="ln"></div>Testemunha 1 — Nome / CPF</div><div><div class="ln"></div>Testemunha 2 — Nome / CPF</div></div></div>`;
}

/* ======== Contrato de experiência — texto oficial ======== */
function docContrato(d,u){
  const e=expDates(d,u);const n=num(d.salario);
  const dd=x=>x?esc(br(x)):v('','DD/MM/AAAA','____/____/______');
  const pa=e?`${e.a} (${extNum(e.a)})`:v('','prazo da unidade','__ (________)');const pb=e?`${e.b} (${extNum(e.b)})`:v('','prorrogação','__ (________)');
  return `<div class="docw ct"><h2>CONTRATO DE EXPERIÊNCIA</h2>
  <p>Pelo presente instrumento particular de Contrato de Experiência, a empresa ${razao(u)} com sede na ${ende(u)}, inscrita no CNPJ sob nº ${cnpj(u)}, denominada a seguir EMPREGADORA, e o(a) Sr.(a) <b>${up(d.nome,'NOME COMPLETO')}</b>, domiciliado na ${v(d.endereco,'endereço do colaborador')}, cidade de ${v(d.cidade,'cidade')}, portador do CTPS nº ${v(d.ctps,'CTPS','________')} série ${v(d.ctpsSerie,'série','______')}, CPF ${v(fmtCPF(d.cpf),'CPF')}, doravante designado(a) EMPREGADO(A), celebram o presente Contrato Individual de Trabalho para fins de experiência, conforme legislação trabalhista em vigor, regido pelas cláusulas abaixo e demais disposições legais vigentes:</p>
  <p>CLÁUSULA 1º. O(A) EMPREGADO(A) fica admitido no quadro de funcionários da EMPREGADORA na função de ${up(d.cargo,'FUNÇÃO')} com remuneração de R$ ${v(money(d.salario),'0,00')} (${isNaN(n)?v('','valor por extenso','______________'):esc(extenso(n))}) por Mês.</p>
  <p>PARÁGRAFO ÚNICO. A circunstância, porém, de ser a função especificada não importa na intransferibilidade do(a) EMPREGADO(A) para outro serviço, no qual demonstre melhor capacidade de adaptação desde que compatível com sua condição pessoal.</p>
  <p>CLÁUSULA 2º. A prestação do serviço se dará na sede da EMPREGADORA ou em local por esta indicada na área do Distrito Federal manifestando, desde já, a EMPREGADA sua anuência e sem que isso configure alteração contratual lesiva.</p>
  <p>CLÁUSULA 3º. O(A) EMPREGADO(A) trabalhará por até 44 (quarenta e quatro) horas semanais e 220 (duzentas e vinte) horas mensais, salvo outro limite expressamente consignado em lei, assegurado o descanso semanal de 24 (vinte e quatro) horas consecutivas, preferencialmente aos domingos e, nos limites das exigências técnicas da Empresa, facultada compensação de horários na forma do artigo 7°, inciso XIII da CF/88.</p>
  <p>PARÁGRAFO PRIMEIRO. O horário ficará ao inteiro arbítrio da EMPREGADORA, que poderá fixá-lo no turno do dia, da noite, turno misto ou mediante escala de revezamento e regime de compensação.</p>
  <p>PARÁGRAFO SEGUNDO. O(A) EMPREGADO(A), quando solicitado, deverá prestar serviços nos domingos, feriados ou no dia de sua folga semanal, ficando-lhe, no entanto, assegurado um outro dia de repouso remunerado na forma da lei, ou o pagamento correspondente, salvo se aplicado o regime de compensação, quando terá folga compensatória, com base no Acordo Coletivo de Trabalho firmado entre o EMPREGADOR e o Sindicato dos Trabalhadores.</p>
  <p>PARÁGRAFO TERCEIRO. Fica pactuada desde já a possibilidade de intervalo intrajornada de no mínimo 30 (trinta) minutos, bem como a possibilidade de intervalo intrajornada máximo de até 4 (quatro) horas de acordo com a necessidade do EMPREGADOR.</p>
  <p>CLÁUSULA 4º. Aceita o(a) EMPREGADO(A) expressamente a condição de prestar serviços em qualquer dos turnos de trabalho, isto é, tanto durante o dia, como à noite, desde que sem simultaneidade, observadas as prescrições legais reguladoras do assunto, quanto a remuneração.</p>
  <p>PARÁGRAFO ÚNICO. O EMPREGADO aceita prestar serviços em horas extraordinárias sempre que solicitado pela EMPREGADORA, devendo receber as horas extraordinárias com acréscimo legal ou convencional, salvo se aplicado regime de compensação, quando será concedida folga compensatória.</p>
  <p>CLÁUSULA 5º. O prazo deste contrato é de ${pa} dias, com inicio em ${dd(d.admissao)} e término em ${dd(e&&e.fim1)}, com prorrogação automática por mais ${pb} dias, iniciando em ${dd(e&&e.ini2)} e terminando em ${dd(e&&e.fim2)}, obedecido o disposto no parágrafo único do artigo 445 da CLT, caso as partes não se manifestem em sentido contrário.</p>
  <p>PARÁGRAFO ÚNICO. Não haverá prorrogação automática por mais ${pb} dias se, antes do encerramento do prazo inicial, uma das partes comunicar à outra, de forma inequívoca, a decisão de não prorrogação.</p>
  <p>CLÁUSULA 6º. O(A) EMPREGADO(A) compromete-se a ceder seus direitos de imagem e voz.</p>
  <p>PARÁGRAFO PRIMEIRO. O(A) EMPREGADO(A) renuncia a este ato por todo e qualquer direito relacionado ao uso de imagem e voz.</p>
  <p>PARÁGRAFO SEGUNDO. Com espeque no artigo 5º, incisos V, X e XXVIII, alínea “a” da CF/88, o EMPREGADO autoriza, sem qualquer ressalva de consentimento e de forma IRREVOGÁVEL e IRRETRATÁVEL, o uso de sua imagem e voz pela EMPREGADORA e as empresas do mesmo grupo econômico, em todo e qualquer material que será utilizado pela EMPREGADORA.</p>
  <p>PARÁGRAFO TERCEIRO. A presente autorização é concedida a título gratuito, abrangendo o uso da imagem e voz em todo território nacional e no exterior, das seguintes formas, não se limitando a estas:</p>
  <p class="opt">(i) Home Page, Outdoor, Redes Sociais e INTRANET da Empresa;</p><p class="opt">(ii) Manuais, Cartilhas, Panfletos e outros documentos informativos;</p><p class="opt">(iii) Procedimento/Instrução de Trabalho contendo relatório de fotos.</p>
  <p>CLÁUSULA 7º. O(A) EMPREGADO(A) compromete-se a executar seu serviço com dedicação e lealdade, bem como observar o regulamento interno da EMPREGADORA, as instruções do(a) representante pela administração e as ordens verbais e/ou escritas de superiores hierárquicos, acaso existentes.</p>
  <p>PARÁGRAFO PRIMEIRO. Salvo mediante expressa autorização, fica o(a) EMPREGADO(A) ciente de que é vedada a disponibilização, reprodução, distribuição ou compartilhamento de imagens, vídeos ou áudios capturados no exercício das atividades laborais bem como dentro das dependências da EMPREGADORA, em perfis públicos na Internet e nas mídias sociais, inclusive em mensagens particulares ou grupos de WhatsApp ou quaisquer aplicativos que não sejam utilizados como instrumento de trabalho.</p>
  <p>PARÁGRAFO SEGUNDO. Fica o(a) EMPREGADO(A) ciente de que deverá manter em estrita confidencialidade todas as informações sigilosas e críticas da EMPREGADORA, demais colaboradores, fornecedores, prestadores de serviços e clientes com os quais tenha contato em virtude do exercício de suas atividades, sob pena de responder pelos danos.</p>
  <p>PARÁGRAFO TERCEIRO. O(A) EMPREGADO(A) declara ter ciência de que a EMPREGADORA monitora o acesso e uso dos ativos materiais e imateriais de sua propriedade, tais como: marcas, informações, bancos de dados, Recursos de Tecnologia da Informação e Comunicação, inclusive e-mail coorporativo, bem como realiza a captura de vídeo, imagens, áudio do aparelho celular disponibilizado como ferramenta de trabalho, com a finalidade de proteção de seu patrimônio e objetivando garantir a segurança dos colaboradores e das pessoas que ingressam nas suas dependências, bem como a monitoramento do regular desempenho das atividades laborais, realizando o armazenamento dos dados monitorados para fins administrativos e legais.</p>
  <p>CLÁUSULA 8º. Além dos descontos previstos na Lei, o(a) EMPREGADO(A) declara estar ciente que sempre que causar algum prejuízo ao empregador, resultante de qualquer conduta dolosa ou culposa, ficará obrigado a ressarcir ao EMPREGADOR por todos os danos causados, pelo que desde já fica o EMPREGADOR, autorizado a efetivar o desconto da importância correspondente ao prejuízo, o qual fará, com fundamento no §1° do artigo 462 da CLT.</p>
  <p>PARÁGRAFO ÚNICO. A EMPREGADORA também fica autorizada a descontar da remuneração ou de quaisquer outros direitos de natureza trabalhista do(a) EMPREGADO(A), os adiantamentos e empréstimos, acaso concedidos, bem como valores de outra natureza cujo desconto foi autorizado pelo(a) EMPREGADO(A).</p>
  <p>CLÁUSULA 9º. O(A) EMPREGADO(A) fica ciente do Regulamento da EMPREGADORA e das Normas de Segurança fornecidos, sob pena de ser punido por falta grave, nos termos da Legislação vigente e demais disposições inerentes à segurança e medicina do trabalho.</p>
  <p>CLÁUSULA 10º. Opera-se a rescisão do presente Contrato pela decorrência do prazo supra ou por vontade de cada uma das partes. Rescindindo-se por vontade do(a) EMPREGADO(A) ou pela EMPREGADORA, com justa causa, nenhuma indenização é devida. Rescindindo-se antes do prazo, pela EMPREGADORA, fica esta obrigada a pagar 50% dos salários devidos até o final (metade do tempo combinado restante), nos termos do artigo 479 da CLT sem prejuízo no Regulamento do Fundo de Garantia por Tempo de serviço. Rescindindo-se antes do prazo, pelo(a) EMPREGADO(A), fica este obrigado a pagar 50% dos salários devidos até o final (metade do tempo combinado restante), nos termos do §1° do artigo 480 da CLT. Nenhum aviso prévio é devido pela rescisão do presente Contrato.</p>
  <p>CLÁUSULA 11º. O(A) EMPREGADO(A) manifesta o seu consentimento que a coleta inicial de dados pessoais realizada tem por finalidade a preparação e a execução do presente contrato e necessários o Registro de Empregados e para o cumprimento de obrigações mensais e anuais prestados aos órgãos governamentais e os benefícios concedidos pela empresa.</p>
  <p>CLÁUSULA 12º. Será exigido do(a) EMPREGADO(A), em qualquer horário a que esteja submetido, o registro de frequência, seja através de assinatura de folha de frequência, seja pela marcação de cartão de ponto ou outro meio de controle, sendo que, na hipótese de trabalho externo não estará subordinado a horário.</p>
  <p>CLÁUSULA 13º. Fica expressamente pactuado que, na hipótese da prestação de serviço na forma prevista no § 3°, do artigo 74 da CLT, o(a) EMPREGADO(A) responderá pela veracidade da jornada que anotar.</p>
  <p>PARÁGRAFO ÚNICO. Será considerado falta grave para dispensa por justa causa, se a qualquer tempo for constatado a falsidade de tais anotações.</p>
  <p>CLÁUSULA 14º. As Partes, por si, por seus representantes, colaboradores e por quaisquer terceiros que por sua determinação participem da prestação de serviços objeto desta relação, comprometem-se a atuar de modo a proteger e a garantir o tratamento adequado dos dados pessoais a que tiverem acesso durante a relação contratual, bem como a cumprir as disposições da Lei nº 13.709/2018 (Lei Geral de Proteção de Dados – LGPD).</p>
  <p>PARÁGRAFO ÚNICO. Cada Parte será individualmente responsável pelo cumprimento de suas obrigações decorrentes da LGPD e das regulamentações emitidas posteriormente pela autoridade reguladora competente.</p>
  <p>PARÁGRAFO PRIMEIRO. O(A) EMPREGADO(A) está ciente de que seus dados pessoais serão utilizados para fins legais e que para tanto poderá haver compartilhamento ou transferência dos mesmos entre empresas do grupo econômico, escritório de contabilidade, empresas especializadas em medicina ocupacional, empresas de Plano de Saúde, Plano Odontológico, Vale Refeição, Vale Alimentação, Seguro e vida, bem como aos Órgãos Públicos na esfera Municipal, Estadual e Federal, com vistas a permitir a gestão dos dados e o cumprimento das obrigações legais.</p>
  <p>PARÁGRAFO SEGUNDO. De acordo com o que determina a Lei Geral de Proteção de Dados, as Partes obrigam-se a tratar os dados pessoais a que tiverem acesso unicamente para os fins e pelo tempo necessários para o cumprimento das suas obrigações e para a adequada execução do objeto contratual, ou ainda com fundamento em outra base legal válida e específica.</p>
  <p>PARÁGRAFO TERCEIRO. Cada uma das Partes deverá também adotar as medidas de segurança, técnicas e administrativas, aptas a proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou qualquer forma de tratamento inadequado ou ilícito, observada a natureza dos dados tratados.</p>
  <p>PARÁGRAFO QUARTO. O(A) EMPREGADO(A) concorda que a EMPREGADORA poderá coletar seus dados, que serão utilizados de forma anonimizada, para a finalidade específica de cumprimento de obrigação legal ou convencional, geração de informações, garantida a proteção destes dados e a sua confidencialidade em qualquer hipótese, de acordo com este instrumento e com a legislação vigente.</p>
  <p>PARÁGRAFO QUINTO. O presente instrumento não modifica ou transfere a propriedade ou o controle sobre os dados pessoais disponibilizados, obtidos ou coletados no âmbito deste instrumento, que permanecerão sendo de propriedade do seu proprietário originário.</p>
  <p>PARÁGRAFO SEXTO. As Partes comprometem-se a cooperar mutuamente, fornecendo informações e adotando outras medidas razoavelmente necessárias com o objetivo de auxiliar a outra Parte no cumprimento das suas obrigações de acordo com a Lei Geral de Proteção de Dados.</p>
  <p>PARÁGRAFO SÉTIMO. Cada Parte se compromete ainda, nas hipóteses de rescisão contratual, por qualquer motivo, ou por solicitação da outra Parte, a devolver ou eliminar, conforme o caso, todos os dados pessoais disponibilizados, obtidos ou coletados no âmbito da relação contratual, salvo se houver base legal válida e específica para manutenção de determinadas informações.</p>
  <p>PARÁGRAFO OITAVO. O(A) EMPREGADO(A) se obriga, durante a vigência e após a extinção do contrato de trabalho, o mais completo e absoluto sigilo em relação a todos e quaisquer documentos, dados, informações, documentos relativos a estratégias econômicas, financeiras, de investimentos, de captações de recursos, de marketing, de clientes, de valores e informações de natureza operacional, financeira, administrativa, contábil e jurídica, armazenadas sob qualquer forma, inclusive informatizadas, não podendo, sob qualquer pretexto, revelar, reproduzir, divulgar, ou dar conhecimento a terceiros, salvo se expressamente autorizada pela outra parte, sob pena de responder civil e criminalmente pelos danos causados ao EMPREGADOR ou a terceiros.</p>
  <p>PARÁGRAFO NONO. A confidencialidade prevista nesta cláusula se aplica a qualquer outra empresa a que a EMPREGADORA esteja vinculada ou coligada por interesses comuns, sob forma de grupo industrial, comercial, ou de qualquer outra atividade econômica.</p>
  <p>PARÁGRAFO DÉCIMO. Não serão consideradas informações confidenciais aquelas informações:</p>
  <p class="opt">1) que já eram ou que venham a tornar-se de domínio público sem culpa do(a) EMPREGADO(A);</p><p class="opt">2) que já eram do conhecimento do funcionário antes do seu ingresso na empresa e/ou tenham sido legitimamente recebidas de terceiros;</p><p class="opt">3) cuja divulgação seja exigida por autoridade competente, obrigando o empregado, neste caso, a informar prontamente à EMPREGADORA o recebimento da ordem correspondente, bem como a divulgar apenas as informações que forem efetivamente objeto do requerimento.</p>
  <p>CLÁUSULA 15º. Vencido o período inicial de experiência, bem como a prorrogação, permanecendo o(a) EMPREGADO(A) a prestar serviços à EMPREGADORA, transformar-se em Contrato de Prazo Indeterminado, pelo decurso do tempo, ficando prorrogadas todas as cláusulas aqui estabelecidas, enquanto não se rescindir o contrato de trabalho.</p>
  <p>Tendo assim contratado e por estarem de pleno acordo, assinam ambas as partes, em duas vias de igual teor, na presença de duas testemunhas.</p>
  <p style="margin-top:14px">Brasília/DF, ${dLine(d)}.</p>
  <div class="sg2 avoid" style="margin-top:44px"><div><div class="ln"></div>EMPREGADORA</div><div><div class="ln"></div>FUNCIONÁRIO</div><div><div class="ln"></div>RESPONSÁVEL LEGAL<br>(quando menor)</div><div></div><div><div class="ln"></div>1º TESTEMUNHA</div><div><div class="ln"></div>2º TESTEMUNHA</div></div></div>`;
}

/* ======== Termo de premiação — modelo oficial ======== */
function docPremio(d,u){
  return `<div class="docw pr"><h2>TERMO ADITIVO AO CONTRATO DE TRABALHO</h2><p style="text-align:center;margin-top:-6px">(Instituição de Pagamento de Prêmio por Desempenho)</p>
  <p>Pelo presente instrumento particular, as partes abaixo qualificadas:</p>
  <p class="tight"><b>EMPREGADOR:</b><br>Razão Social: <b>${razao(u)}</b><br>CNPJ: <b>${cnpj(u)}</b><br>Endereço: <b>${u?esc(u.end.toUpperCase()):v('','endereço')}</b><br>Neste ato representada por seu representante legal.</p>
  <p class="tight"><b>EMPREGADO(A):</b><br>Nome Completo: <b>${up(d.nome,'NOME COMPLETO')}</b><br>CPF: ${v(fmtCPF(d.cpf),'CPF')}<br>Cargo: <b>${up(d.cargo,'CARGO')}</b></p>
  <p>Têm entre si justo e contratado o presente Aditivo Contratual, que passa a fazer parte integrante do Contrato de Trabalho original, mediante as seguintes cláusulas e condições:</p>
  <h4>CLÁUSULA PRIMEIRA – DO OBJETO</h4><p>O presente aditivo tem por objetivo instituir a possibilidade de pagamento de <b>PRÊMIOS</b>, a título de liberalidade do EMPREGADOR, condicionado ao atingimento de metas e desempenho superior ao ordinariamente esperado no exercício das atividades do EMPREGADO.</p>
  <h4>CLÁUSULA SEGUNDA – DA NATUREZA JURÍDICA (BASE LEGAL)</h4><p>Conforme estabelece o <b>Art. 457, § 2º e § 4º da CLT</b>, as importâncias pagas a título de prêmio, ainda que habituais, <b>não integram a remuneração do empregado</b>, não se incorporam ao contrato de trabalho e não constituem base de incidência de qualquer encargo trabalhista e previdenciário (não incidindo FGTS ou INSS).</p>
  <h4>CLÁUSULA TERCEIRA – DOS CRITÉRIOS DE ELEGIBILIDADE</h4><p>O pagamento do prêmio não é fixo, nem garantido, dependendo exclusivamente do desempenho do EMPREGADO ou da EQUIPE, conforme critérios de produtividade, eficiência ou qualidade estabelecidos na <b>Política Interna de Premiação</b> da empresa, vigente à época da apuração.<br><b>Parágrafo Único:</b> A empresa reserva-se o direito de alterar as metas, os indicadores de desempenho e os valores dos prémios, ou mesmo suprimir a campanha de premiação a qualquer momento, comunicando o EMPREGADO com antecedência, visto tratar-se de verba condicionada a resultado extraordinário.</p>
  <h4>CLÁUSULA QUARTA – DO PAGAMENTO</h4><p>O pagamento, quando devido pelo atingimento das metas estipuladas, será discriminado na folha de pagamento sob a rubrica específica de <b>"PRÊMIO"</b> ou <b>"PRÊMIO POR DESEMPENHO"</b>, separado do salário base, para fins de clareza contábil e jurídica.</p>
  <h4>CLÁUSULA QUINTA – DA RATIFICAÇÃO</h4><p>Permanecem inalteradas e em pleno vigor todas as demais cláusulas do Contrato de Trabalho original que não foram modificadas por este instrumento.<br>E, por estarem de pleno acordo, as partes assinam o presente termo em 02 (duas) vias de igual teor.</p>
  <p style="text-align:right;margin-top:18px"><b>Brasília - DF</b>, ${dLine(d)}.</p>
  <div class="avoid" style="margin-top:44px;text-align:center"><div class="ln"></div><b>${razao(u)}</b><br>EMPREGADOR<div class="ln" style="margin-top:50px"></div><b>${up(d.nome,'NOME')}</b><br>EMPREGADO</div></div>`;
}

/* ======== Aditivos — modelos oficiais ======== */
function docAditCargo(d,u){
  const temCargo=String(d.cargoNovo||'').trim(),temSal=String(d.salarioNovo||'').trim();
  return `<div class="docw ad"><h2>TERMO ADITIVO AO CONTRATO DE TRABALHO</h2>
  <p>${razao(u)}, inscrita no C.N.P.J. ${cnpj(u)}, com endereço ${u?esc(u.end.toUpperCase()):v('','endereço')}, doravante denominada EMPREGADOR(A) e de outro lado ${up(d.nome,'NOME')}, admitido em ${vd(d.admissao)}, portador(a) do documento de identidade nº ${v(d.rg,'RG','________')} ${v(d.rgOrgao,'órgão/UF','____')}, inscrito(a) no CPF sob o nº ${v(fmtCPF(d.cpf),'CPF')}, portador(a) da Carteira Profissional e Previdência Social nº ${v(d.ctps,'CTPS','________')} – Série ${v(d.ctpsSerie,'série','____')}, inscrito(a) no PIS sob o n.º ${v(d.pis,'PIS','__________')}, residente e domiciliado(a) na ${v(d.endereco,'endereço')}, têm como justo e acertado o presente termo aditivo ao contrato de trabalho:</p>
  <p><b>Cláusula Primeira:</b> Por mútuo acordo entre as partes, ${temCargo||!temSal?`o cargo do empregado acima qualificado fica alterado de:</p><p class="ctr">${up(d.cargo,'CARGO ATUAL')}</p><p>Foi alterado para:</p><p class="ctr">${up(d.cargoNovo,'NOVO CARGO')}</p>`:`o salário do empregado acima qualificado, no cargo de ${up(d.cargo,'CARGO')}, fica alterado:</p>`}
  ${temSal?`<p>Com o sálario sendo alterado de:</p><p class="ctr">${moneyExt(d.salario)}</p><p>Para:</p><p class="ctr">${moneyExt(d.salarioNovo)}</p>`:''}
  <p><b>Cláusula Segunda:</b> O contrato de trabalho fica ratificado em todos os seus termos, cláusulas e condições não expressamente alteradas por este documento, que àquele se integra, formando um todo, único e indivisível para todos os efeitos legais. Assinado por ambas as partes em duas vias de igual teor, na presença das testemunhas abaixo assinadas.</p>
  <p style="text-align:right;margin-top:16px">BRASILIA/DF, ${dLine(d,0,brUp)}.</p>
  <div class="sg2 avoid"><div><div class="ln"></div>${razao(u)}<br>C.N.P.J.: ${cnpj(u)}</div><div><div class="ln"></div>${up(d.nome,'NOME')}<br>C.P.F.: ${v(fmtCPF(d.cpf),'CPF')}</div></div>
  <p class="ctr" style="margin-top:22px">TESTEMUNHAS:</p><div class="sg2" style="margin-top:28px"><div><div class="ln"></div>1.</div><div><div class="ln"></div>2.</div></div></div>`;
}
function docAditConf(d,u){
  const dest=d.transferir?unitOf(d.unidadeDestino):null;const vig=d.vigencia;
  const s=num(d.salarioNovo),p=num(d.gratPerc||40);const g=!isNaN(s)&&!isNaN(p)?s*p/100:NaN;
  let c=0;const cl=t=>`<h4>Cláusula ${ORD[c++]} – ${t}</h4>`;
  const qual=`${razao(u)}, pessoa jurídica inscrita no C.N.P.J. sob o nº ${cnpj(u)}, com sede na ${ende(u)}, doravante denominada EMPREGADOR(A), e de outro lado <b>${up(d.nome,'NOME')}</b>, ${v(d.nacionalidade,'brasileiro(a)')}, ${v(String(d.estadoCivil||'').toLowerCase(),'estado civil')}, nascido em ${vd(d.nascimento)}, admitido em ${vd(d.admissao)}, portador(a) do documento de identidade nº ${v(d.rg,'RG','________')}, expedido pela ${v(d.rgOrgao,'SSP/DF','______')}, inscrito(a) no CPF sob o nº ${v(fmtCPF(d.cpf),'CPF')}, portador(a) da Carteira de Trabalho e Previdência Social nº ${v(d.ctps,'CTPS','______')}, Série ${v(d.ctpsSerie,'série','____')}, residente e domiciliado(a) na ${v(d.endereco,'endereço')}, doravante denominado(a) EMPREGADO(A), têm entre si justo e acertado o presente ${dest?'Termo de Transferência e Aditivo ao Contrato de Trabalho':'Termo Aditivo ao Contrato de Trabalho'}, mediante as cláusulas seguintes:`;
  let h='';let nCargo;
  if(d.transferir){h+=cl('Da Transferência')+`<p>Por mútuo acordo entre as partes, a partir de ${vd(vig)}, o(a) EMPREGADO(A) fica transferido(a) do estabelecimento acima qualificado, inscrito no C.N.P.J. sob o nº ${cnpj(u)}, para o estabelecimento da mesma empregadora situado na ${dest?esc(dest.end):v('','unidade de destino')}, inscrito no C.N.P.J. sob o nº ${dest?esc(dest.cnpj):v('','CNPJ destino')}, nos termos do artigo 469 da Consolidação das Leis do Trabalho (CLT), sem qualquer ônus ou prejuízo ao(à) EMPREGADO(A).</p>`}
  nCargo=ORD[c];
  h+=cl('Do Cargo de Confiança')+`<p>${d.transferir?`Em razão da transferência de que trata a Cláusula Primeira, o cargo do(a) EMPREGADO(A) fica alterado, também a partir de ${vd(vig)}`:`A partir de ${vd(vig)}, o cargo do(a) EMPREGADO(A) fica alterado`}, de ${up(d.cargo,'CARGO ATUAL')} para ${up(d.cargoNovo,'NOVO CARGO')}, função esta exercida em caráter de cargo de confiança, nos termos do artigo 62, inciso II, da CLT.</p>`;
  h+=cl('Do Salário e da Gratificação de Função')+`<p>A partir de ${vd(vig)}, o salário-base mensal do(a) EMPREGADO(A) fica fixado em ${moneyExt(d.salarioNovo)}. Em razão do exercício do cargo de confiança de que trata a Cláusula ${nCargo}, incidirá sobre o salário-base uma gratificação de função de ${isNaN(p)?'40':p.toLocaleString('pt-BR')}% (${extNum(isNaN(p)?40:p)} por cento), correspondente a ${isNaN(g)?v('','R$ 0,00'):`R$ ${money(g)} (${esc(extenso(g))})`}, passando a remuneração mensal total a ${isNaN(g)?v('','R$ 0,00'):`R$ ${money(s+g)} (${esc(extenso(s+g))})`}.</p>`;
  h+=cl('Do Horário de Trabalho e Controle de Jornada')+`<p>Em decorrência do exercício do cargo de confiança e da autonomia inerente à função, o(a) EMPREGADO(A) fica dispensado(a) do controle de jornada de trabalho, não fazendo jus a horas extras, adicional noturno e demais adicionais decorrentes da jornada, nos termos do artigo 62, inciso II, da CLT. O horário de trabalho será flexível e compatível com as necessidades do cargo.</p>`;
  h+=cl('Da Ratificação')+`<p>Permanecem inalteradas e em pleno vigor todas as demais cláusulas e condições do contrato de trabalho originalmente firmado em ${vd(d.admissao)}, não expressamente modificadas por este instrumento, que a ele se integra, formando um todo único e indivisível para todos os efeitos legais. E, por estarem assim justas e acordadas, as partes firmam o presente Termo, em 02 (duas) vias de igual teor, na presença das testemunhas abaixo assinadas.</p>`;
  return `<div class="docw cf"><h2>${dest||d.transferir?'TERMO DE TRANSFERÊNCIA E ADITIVO AO CONTRATO DE TRABALHO':'TERMO ADITIVO AO CONTRATO DE TRABALHO'}</h2>${d.transferir?'':'<p class="ctr" style="margin-top:-8px;font-weight:700;font-size:11px">CARGO DE CONFIANÇA</p>'}
  <p>${qual}</p>${h}
  <p class="ctr" style="margin-top:14px">Brasília/DF, ${dLine(d)}.</p>
  <div class="ctr avoid" style="margin-top:34px"><div class="ln"></div><b>${razao(u)}</b><br>C.N.P.J.: ${cnpj(u)}<div class="ln" style="margin-top:40px"></div><b>${up(d.nome,'NOME')}</b><br>C.P.F.: ${v(fmtCPF(d.cpf),'CPF')}<p style="margin-top:18px"><b>TESTEMUNHAS:</b></p></div><div class="sg2" style="margin-top:26px"><div><div class="ln"></div>1.</div><div><div class="ln"></div>2.</div></div></div>`;
}
function docAditEscala(d,u){
  const nova=String(d.cargoNovo||'').trim();const vig=d.vigencia;const ant=vig?addDays(vig,-1):'';
  const titulo=nova?'TERMO DE ALTERAÇÃO DE FUNÇÃO E JORNADA DE TRABALHO':'TERMO DE ALTERAÇÃO DE JORNADA DE TRABALHO';
  return `<div class="docw es"><h2>${titulo}</h2>
  <p>Pelo presente instrumento particular, as partes abaixo identificadas:</p>
  <p><b>EMPREGADOR:</b> ${razao(u)}, inscrita no CNPJ sob nº ${cnpj(u)}, com sede à ${u?esc(u.end.toUpperCase()):v('','endereço')}.</p>
  <p><b>EMPREGADO(A):</b> ${up(d.nome,'NOME')}, portador(a) do CPF nº ${v(fmtCPF(d.cpf),'CPF')}.</p>
  <p>têm entre si, de comum acordo, com fundamento no artigo 468 da Consolidação das Leis do Trabalho (CLT), o presente ${titulo}, conforme as cláusulas seguintes:</p>
  <p><b>Cláusula Primeira – Da Alteração:</b> Fica ajustado entre as partes que, a partir do dia ${vig?esc(brUp(vig)):v('','data de início')}, o(a) empregado(a) passará a exercer a função de ${nova?esc(nova.toUpperCase()):up(d.cargo,'FUNÇÃO')}, sob o regime de escala ${v(d.escalaNova,'escala')}, com horário de ${v(d.horarioNovo,'00h00 às 00h00')}, havendo intervalo intrajornada de ${v(d.intervalo,'01 (uma) hora')}.</p>
  <p><b>Cláusula Segunda – Da Situação Anterior:</b> O(a) empregado(a) exercia a função de ${up(d.cargo,'FUNÇÃO ANTERIOR')}, ${d.escalaAtual?`sob o regime de escala ${esc(d.escalaAtual)}, `:''}com horário de ${v(d.horarioAnterior,'00h00 às 00h00')}, até o dia ${ant?esc(brUp(ant)):v('','dia anterior')}.</p>
  <p><b>Cláusula Terceira – Da Justificativa e Concordância:</b> A alteração de ${nova?'função e de jornada':'jornada'} decorre de necessidade operacional da empresa, visando adequação às demandas do serviço. O(a) empregado(a) declara que foi devidamente informado(a) sobre a mudança, compreendeu suas condições e concorda expressamente com a alteração, firmando o presente termo de forma livre e espontânea, sem qualquer prejuízo direto ou indireto.</p>
  <p><b>Cláusula Quarta – Da Manutenção das Demais Condições Contratuais:</b> As demais cláusulas do contrato de trabalho permanecem inalteradas, mantendo-se todas as condições anteriormente ajustadas, inclusive salário, local de trabalho e benefícios.</p>
  <p>E, por estarem de pleno acordo, assinam o presente termo em duas vias de igual teor e forma, na presença de testemunhas.</p>
  <p style="margin-top:14px">Brasília-DF, ${dLine(d,0,brUp)}</p>

const fc=(lb,val,flex,st)=>`<div class="c" style="flex:${flex||1};${st||''}"><span class="lb">${lb}</span><div class="vl">${val}</div></div>`;
function docFicha(d,u){
  const e=expDates(d,u);const N=fv(String(d.nome||'').toUpperCase());const nro=String(d.matricula||'').trim();
  const p1=`<div class="docw fr">
  <div class="bx tit">REGISTRO DE EMPREGADO</div>
  <div class="fl"><div class="bx" style="flex:0 0 24%;text-align:center;font-size:7px;padding-top:3px">Autenticar</div>
    <div class="bx" style="flex:1"><div class="r">${fc('Matrícula eSocial',fv(d.matricula),8.6)}${fc('Nº',fv(nro),1.4,'text-align:right')}</div><div class="r">${fc('Empregador',u?esc(u.razao):'&nbsp;',7)}${fc('CNPJ',u?esc(u.cnpj):'&nbsp;',3)}</div><div class="r">${fc('Endereço',u?esc(u.end.toUpperCase()):'&nbsp;')}</div></div></div>
  <div class="fl"><div class="bx" style="flex:1"><div class="r">${fc('Empregado',N)}</div><div class="r">${fc('Residência',fv([d.endereco,d.cidade,d.cep?'CEP: '+d.cep:''].filter(Boolean).join(', ')),1,'min-height:34px')}</div></div><div class="bx" style="flex:1"><div class="r">${fc('Beneficiários',fv(d.beneficiarios),1,'min-height:60px')}</div></div></div>
  <div class="fl"><div class="bx foto">Foto 3x4</div><div class="bx" style="flex:1">
    <div class="r">${fc('Data de nascimento',fv(br(d.nascimento)))}${fc('Local do nascimento',fv(String(d.localNasc||'').toUpperCase()),1.6)}${fc('País da nacionalidade',fv(String(d.pais||'').toUpperCase()))}${fc('Estado civil',fv(d.estadoCivil))}</div>
    <div class="r"><div class="c" style="flex:0 0 56px;display:flex;align-items:center;font-size:7px">FILIAÇÃO</div><div style="flex:1"><div class="r" style="border:0">${fc('Pai',fv(String(d.pai||'').toUpperCase()))}</div><div class="r">${fc('Mãe',fv(String(d.mae||'').toUpperCase()))}</div></div></div>
    <div class="r">${fc('Cédula de Identidade',fv(d.rg))}${fc('Data de emissão',fv(br(d.rgEmissao)),.8)}${fc('Órgão/UF emissor',fv(d.rgOrgao),.8)}${fc('Título Eleitoral',fv(d.titulo),1.1)}${fc('Zona',fv(d.zona),.45)}${fc('Seção',fv(d.secao),.45)}${fc('Inscr. Órgão de Classe','&nbsp;',.9)}</div>
    <div class="r">${fc('CTPS',fv(d.ctps),.8)}${fc('Série',fv(d.ctpsSerie),.5)}${fc('Data de expedição da CTPS',fv(br(d.ctpsData)),1)}${fc('UF CTPS',fv(d.ctpsUF),.5)}${fc('CPF',fv(fmtCPF(d.cpf)),1.1)}${fc('Cart. Nac. Habilitação',fv(d.cnh),1)}${fc('Categoria',fv(d.cnhCat),.6)}</div>
    <div class="r">${fc('Doc. militar',fv(d.reservista))}${fc('Categoria',fv(d.reservistaCat),.7)}${fc('Cor',fv(d.cor),.9)}${fc('Sexo',fv(d.sexo),.9)}${fc('Grau de instrução',fv(d.instrucao),1.5)}</div>
    <div class="r">${fc('Deficiência',fv(d.deficiencia),1.6)}${fc('Telefone Residencial',fv(d.telRes),1.4)}${fc('Telefone Celular',fv(d.telCel),1.2)}</div>
    <div class="r">${fc('Cargo',fv(String(d.cargo||'').toUpperCase()),1.6)}${fc('Função',fv(String(d.funcao||'').toUpperCase()),1.6)}${fc('C.B.O.',fv(d.cbo),.6,'text-align:right')}</div>
  </div></div>
  <div class="bx"><div class="r">${fc('Data de Admissão',fv(br(d.admissao)))}${fc('Salário',fv(d.salario?'R$ '+money(d.salario):''))}${fc('Por',fv(d.salarioPor),.6)}${fc('Horário de Trabalho',fv(d.horarioTrab),1.3)}${fc('Jornada de Trabalho',fv(d.jornadaFicha==='outra'?d.jornadaOutra:d.jornadaFicha),1.7)}</div></div>
  <div class="bx"><div class="r"><div class="c" style="flex:.6;display:flex;align-items:center;justify-content:center;font-size:8px">FGTS</div>${fc('Opção em',fv(br(d.admissao)),.8)}${fc('Conta vinculada no banco','&nbsp;',2.4)}${fc('Data da Retificação','&nbsp;',1.2)}</div></div>
  <div class="bx"><div class="t">PROGRAMA DE INTEGRAÇÃO SOCIAL - PIS</div><div class="r" style="border:0">${fc('Cadastrado em','&nbsp;',.8)}${fc('Sob nº',fv(d.pis),1)}${fc('Domicílio bancário','&nbsp;',2.4)}</div><div class="r">${fc('Nº banco','&nbsp;',.8)}${fc('Agência código','&nbsp;',1)}${fc('End. da agência','&nbsp;',2.4)}</div></div>
  <div class="bx"><div class="t">ALTERAÇÕES DE SALÁRIO, CARGO E/OU FUNÇÃO</div><div class="r" style="border:0"><div class="c" style="height:92px"></div><div class="c"></div></div></div>
  <div class="fl"><div class="bx" style="flex:1.45"><div class="r" style="border:0">${['FÉRIAS - PERÍODO AQUISITIVO','FÉRIAS - PERÍODO DE GOZO','FÉRIAS - PERÍODO ABONO PECUNIÁRIO'].map(x=>`<div class="c" style="height:100px;padding:0"><div class="t" style="font-size:6.5px">${x}</div></div>`).join('')}</div></div>
    <div class="bx" style="flex:1"><div class="t">Obs.: (Anotar advertências, suspensões, transferências, etc.)</div><div style="padding:6px 10px">${'<div style="border-bottom:1px solid #333;height:15px"></div>'.repeat(5)}</div></div></div>
  <div class="fl"><div class="bx" style="flex:1.45"><div class="t">ACIDENTES DE TRABALHO, DOENÇAS OU DOENÇAS PROFISSIONAIS</div><div class="r" style="border:0"><div class="c" style="height:76px"></div><div class="c"></div></div></div>
    <div class="bx" style="flex:1"><div class="t">RESCISÃO DE CONTRATO DE TRABALHO</div><div style="padding:4px 6px;font-size:8px;line-height:1.9">Data da saída:<br><span style="display:inline-block;width:52%">Data aviso ind.:</span>Data projeção:<br>Tipo do desligamento:</div></div></div>
  <div class="fl"><div class="bx" style="flex:1.45"><div class="t">CONTRIBUIÇÃO SINDICAL</div><div class="r" style="border:0"><div class="c" style="height:96px"></div><div class="c"></div></div></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:8.5px;padding-bottom:4px"><div class="ln" style="border-top:1px solid #333;margin:0 6px 4px"></div>${N}<div class="ln" style="border-top:1px solid #333;margin:22px 6px 4px"></div>${u?esc(u.razao):'&nbsp;'}</div></div>
  <div class="bx"><div class="t" style="border:0">OBSERVAÇÕES</div><div style="height:18px"></div></div></div>`;
  const p2=`<div class="docw fr fr2"><div class="bx" style="padding:3px 6px;font-size:8.5px;line-height:1.6;display:flex;justify-content:space-between"><div>REGISTRO DE EMPREGADO<br>${u?esc(u.razao):'&nbsp;'}<br>${N}</div><div>Nº: ${fv(nro)}<br>CNPJ: ${u?esc(u.cnpj):''}</div></div>
  <div class="bx"><div class="t">INFORMAÇÕES DO CONTRATO DE PRAZO DETERMINADO</div><div class="r" style="border:0;text-align:center">${['Data início','Data final','Dias de prorrogação','Fim prorrogação','Quantidade de dias','Contrato de Experiência'].map(x=>`<div class="c" style="font-size:7.5px">${x}</div>`).join('')}</div>
  <div class="r" style="text-align:center">${[br(d.admissao),e?br(e.fim1):'',e?e.b:'',e?br(e.fim2):'',e?e.a:'','Sim'].map(x=>`<div class="c" style="font-size:8.5px">${fv(x)}</div>`).join('')}</div></div></div>`;
  return [p1,p2];

/* ======== Gerador de PDF próprio (largura fixa, quebra de página por bloco) ======== */
const PDF_M={t:12.7,l:15.2,w:179.6,h:271.6},PDF_W=680,PDF_PH=Math.floor(PDF_M.h*PDF_W/PDF_M.w);
async function ensurePdfLibs(){
  if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(!window.html2canvas)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
}
async function buildPdfBlob(){
  await ensurePdfLibs();
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
  const parts=exportHTML();let first=true;
  const holder=document.createElement('div');holder.setAttribute('aria-hidden','true');
  holder.style.cssText=`position:fixed;left:0;top:0;width:${PDF_W}px;z-index:-1;pointer-events:none;background:#fff`;
  document.body.appendChild(holder);
  const add=(c,h,s)=>{if(!first)pdf.addPage();first=false;const w=PDF_M.w*s;pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',PDF_M.l+(PDF_M.w-w)/2,PDF_M.t,w,h*PDF_M.w/PDF_W*s)};
  try{
    for(const html of parts){
      holder.innerHTML=`<div class="pdf-root" style="width:${PDF_W}px;background:#fff;color:#111">${html}</div>`;
      const root=holder.firstElementChild;
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      await Promise.all([...root.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
      const total=Math.ceil(root.scrollHeight);
      const canvas=await html2canvas(root,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:PDF_W,height:total,windowWidth:1400,windowHeight:Math.max(total,1400),scrollX:0,scrollY:0,x:0,y:0});
      const k=canvas.width/PDF_W;
      const one=root.querySelector('.docw.md,.docw.un,.docw.pd,.docw.fr,.docw.gd');
      if(one&&total<=PDF_PH*1.4){add(canvas,total,Math.min(1,PDF_PH/total));continue}
      const rr=root.getBoundingClientRect();
      const blocks=[...root.querySelectorAll('p,tr,li,h1,h2,h3,h4,.avoid,.sigs,.sg2,.box,.sig,.usig,.bx')].map(e=>{const r=e.getBoundingClientRect();return [r.top-rr.top,r.bottom-rr.top]}).filter(b=>b[1]-b[0]<PDF_PH*0.85);
      let y=0;
      while(y<total-4){
        let end=Math.min(y+PDF_PH,total);
        if(end<total){const cross=blocks.filter(([t,b])=>t<end-1&&b>end+1&&t>y+20);if(cross.length){const t=Math.min(...cross.map(c=>c[0]));if(t>y+PDF_PH*0.3)end=Math.floor(t)-2}}
        const sh=Math.round((end-y)*k);const c=document.createElement('canvas');c.width=canvas.width;c.height=sh;
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,sh);g.drawImage(canvas,0,Math.round(y*k),canvas.width,sh,0,0,canvas.width,sh);
        add(c,end-y,1);y=end;
      }
    }
  }finally{holder.remove()}
  return pdf.output('blob');
}

function withDevol(d,u,html){return d.incDevol?[html,docUnifDevol(d,u)]:[html]}
function calcExp(d,u){const e=expDates(d,u);if(!u)return[['__warn','Escolha a unidade para definir CNPJ e prazo de experiência.']];if(!e)return[['Prazo da unidade',`${u.exp[0]} + ${u.exp[1]} dias`]];return[['Prazo da unidade',`${e.a} + ${e.b} dias`],['Fim do 1º período',br(e.fim1)],['Prorrogação',`${br(e.ini2)} a ${br(e.fim2)}`]]}
function calcAntec(d,u){const out=calcExp(d,u);const e=expDates(d,u);if(e&&d.dataRescisao){const prev=d.fase==='2'?e.fim2:e.fim1;const rest=Math.round((toD(prev)-toD(d.dataRescisao))/864e5);if(rest>0)out.push(['Dias restantes até o termo',rest],['Indenização art. 479',`${(rest/2).toLocaleString('pt-BR')} dias de remuneração`]);else out.push(['__warn','A data de rescisão está no fim ou depois do prazo; use "Término do contrato de experiência".'])}return out}

/* ================= Medida disciplinar (modelo Wine Garden / Jhulia) ================= */
function linhaDe(d){const i=INFR[d.infracao]||INFR.falta;return i.al||d.alineaOutro||''}
function calcMedidaRaw(d){
  const al=linhaDe(d);const seq=d.gestante?SEQ_G:SEQ_N;
  const prev=d.reincidente==='sim'?(d.anteriores||[]).filter(r=>r.nivel&&r.assinada!=='nao'):[];
  const idx=Math.min(prev.length,seq.length-1);
  const sug=seq[idx];const nivel=d.nivelManual||sug;
  const posNivel=d.nivelManual?Math.max(seq.indexOf(nivel),0):idx;
  const prox=seq[Math.min(posNivel+1,seq.length-1)];
  return {al,seq,prev,sug,nivel,prox};
}
function calcMedida(d){
  const c=calcMedidaRaw(d);const out=[];
  out.push(['Linha da infração',c.al?`Art. 482, alínea "${c.al}"`:'escolha a alínea']);
  out.push(['Medidas assinadas na mesma linha',String(c.prev.length)]);
  out.push(['Nível sugerido',NIVEL[c.sug]+(d.gestante?' (escala gestante)':'')]);
  if(d.nivelManual&&d.nivelManual!==c.sug)out.push(['__warn',`Você escolheu ${NIVEL[d.nivelManual]}, diferente do sugerido pela escala.`]);
  if(c.nivel==='suspensao'){const n=parseInt(d.suspDias)||1;const ini=d.suspInicio||d.dataDoc;out.push(['Suspensão',`${br(ini)} a ${br(addDays(ini,n-1))}`],['Retorno',br(addDays(ini,n))]);if(n>30)out.push(['__risk','Suspensão acima de 30 dias consecutivos configura rescisão injusta (art. 474 CLT).'])}
  if(c.nivel==='justa')out.push(['__risk','A escala chegou à justa causa. Use o modelo "Dispensa por justa causa" e valide com o jurídico antes de aplicar.']);
  const hist=histMatches(d);if(hist.length)out.push(['__hist',hist]);
  return out;
}
const NIVEL_DOC={verbal:'Advertência Verbal',escrita:'Advertência Escrita',suspensao:'Suspensão Disciplinar'};
function docMedida(d,u){
  const c=calcMedidaRaw(d);const nivel=c.nivel==='justa'?'suspensao':c.nivel;
  const titulo={verbal:'Advertência Verbal ao Empregado',escrita:'Advertência ao Empregado',suspensao:'Suspensão ao Empregado'}[nivel];
  const ref={verbal:'ADVERTÊNCIA VERBAL',escrita:'ADVERTÊNCIA',suspensao:'SUSPENSÃO'}[nivel];
  const inf=INFR[d.infracao]||INFR.falta;const al=c.al;
  const n=parseInt(d.suspDias)||1;const ini=d.suspInicio||d.dataDoc;const ret=ini?addDays(ini,n):'';
  const pena=nivel==='suspensao'?`SUSPENSÃO por ${n} (${extNum(n)}) dia${n>1?'s':''} devendo retornar em ${ret?esc(br(ret)):'____/____/______'}.`:`${ref} em virtude de que, espera contar com a sua compreensão, para que tais e lamentáveis ocorrências não mais se verifiquem.`;
  const relato=String(d.relato||'').trim();const datas=String(d.datasOcorr||'').trim();
  const fato=relato?esc(relato).replace(/\n+/g,' '):(datas?`Colaborador(a) ${inf.frase(esc(datas))}.`:v('','descreva o que aconteceu'));
  const hist=(d.reincidente==='sim'&&d.citarAnteriores)?c.prev.filter(r=>r.data):[];
  const teveSusp=hist.some(r=>r.nivel==='suspensao');
  const alTxt=al?`configurando a hipótese de ${ALINEAS[al]}, conforme previsto no artigo 482, alínea "${al}", da Consolidação das Leis do Trabalho (CLT).`:'';
  let desc;
  if(hist.length){
    desc=`<p class="dsc"><b>Descrição:</b> ${fato}</p><p class="dsc">Registra-se que o(a) empregado(a) é reincidente no descumprimento de seus deveres, já tendo sido formalmente ${teveSusp?'advertido(a) e suspenso(a)':'advertido(a)'} em ocasiões anteriores pelo mesmo comportamento, conforme histórico abaixo:</p><ul class="hist">${hist.map(r=>`<li>${esc(br(r.data))}: ${NIVEL_DOC[r.nivel]}${r.motivo?' '+esc(r.motivo):''}.</li>`).join('')}</ul><p class="dsc">Diante da nova ocorrência e da manifesta reiteração da conduta, aplica-se a presente ${nivel==='suspensao'?`Suspensão Disciplinar por ${n} (${extNum(n)}) dia${n>1?'s':''}`:NIVEL_DOC[nivel]}. Tal comportamento ${alTxt?'demonstra descumprimento das obrigações contratuais, '+alTxt:'demonstra descumprimento das obrigações contratuais.'}</p>`;
  } else {
    desc=`<p class="dsc dsb"><span style="font-weight:400">Descrição:</span> ${fato}</p>${alTxt?`<p class="dsc">Tal conduta caracteriza descumprimento das obrigações contratuais, ${alTxt}</p>`:''}`;
  }
  const reinc={escrita:'levará advertência escrita',suspensao:nivel==='suspensao'?'levará nova suspensão':'levará suspensão',justa:'está passível de demissão por justa causa',verbal:'levará advertência'}[c.prox];
  const reincTxt=(nivel==='escrita'&&c.prox==='escrita')?'levará nova advertência':reinc;
  return `<div class="docw md">${c.nivel==='justa'&&!EXPORT?'<div class="draft">A escala indica justa causa; este documento mostra a suspensão só como referência</div>':''}
  <div class="mbox"><div class="mt">${titulo}</div>
  <div class="mco"><span>${u?esc(u.razao):v('','RAZÃO SOCIAL')}</span><span>CNPJ: ${u?esc(u.cnpj):v('','CNPJ')}</span></div>
  <div class="memp"><div><span>Empregado</span>: ${up(d.nome,'NOME')}</div><div><span>CPF</span>: ${v(fmtCPF(d.cpf),'000.000.000-00')}</div></div>
  <div class="mbody"><p class="in">BRASILIA-DF, ${dLine(d)}</p>
  <p class="in" style="margin-top:22px">Ref. : ${ref}</p>
  <p style="margin-top:22px">Prezado(a) Senhor(a), ${up(d.nome,'NOME')}</p>
  <p class="ind" style="margin-top:30px">Cientificamos Vossa Senhoria de que, em razão da falta abaixo transcrita, a direção desta empresa resolveu aplicar-lhe a penalidade de ${pena}</p>
  ${desc}
  <p class="in" style="margin-top:26px"><b>No caso de reincidência do motivo mencionado, o colaborador fica informado que ${reincTxt}.</b></p>
  <p class="in" style="margin-top:26px">Saudações,</p>
  <div class="msig" style="width:46%;margin-top:46px"><div class="ln"></div>Empregador</div>
  <div class="mcie"><span>Ciente em <span class="bl"></span> , <span class="bl"></span> , <span class="bl"></span></span><div class="msig" style="width:46%"><div class="ln"></div>Empregado</div></div>
  <div class="msig" style="width:46%;margin:30px 0 0 auto"><div class="ln"></div>Responsável legal (quando menor)</div>
  <div class="mwit"><div class="msig"><div class="ln"></div>Testemunha</div><div class="msig"><div class="ln"></div>Testemunha</div></div>
  </div></div></div>`;
}

function fieldHTML(k,d,t){
  const f=F[k];if(!f)return '';if(f.show&&!f.show(d,t))return '';
  const id='f_'+k,val=d[k]??'';const cls='fld'+(f.full?' full':'');
  const help=f.help?`<span class="help">${f.help}</span>`:'';
  if(f.t==='import')return `<div class="${cls} imp" id="impBox">${impHTML()}</div>`;
  if(f.t==='check')return `<div class="${cls}"><label class="chk" for="${id}"><input type="checkbox" id="${id}" data-k="${k}" ${val?'checked':''}> ${f.l}</label>${help}</div>`;
  if(f.t==='unit')return `<div class="${cls}"><label for="${id}">${f.l}</label><select id="${id}" data-k="${k}" data-re="1"><option value="">Escolha a unidade…</option>${UNITS.map(u=>`<option value="${u.id}" ${val===u.id?'selected':''}>${esc(u.nome)} — ${u.cnpj}</option>`).join('')}</select>${help}</div>`;
  if(f.t==='select')return `<div class="${cls}"><label for="${id}">${f.l}</label><select id="${id}" data-k="${k}" data-re="1">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o||'—'];return `<option value="${esc(a)}" ${String(val)===String(a)?'selected':''}>${esc(b)}</option>`}).join('')}</select>${help}</div>`;
  if(f.t==='textarea')return `<div class="${cls}"><label for="${id}">${f.l}</label><textarea id="${id}" data-k="${k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>${help}</div>`;
  if(f.t==='list'){const rows=d[k]||[];const tpl=f.cols.map(c=>c[2]).join(' ');
    return `<div class="${cls}"><span class="eyebrow">${f.l}</span><div class="lst" style="--cols:${tpl}"><div class="li"><span class="hd">${f.cols.map(c=>c[1]).join('</span><span class="hd">')}</span><span></span></div>${rows.map((r,i)=>`<div class="li">${f.cols.map(([ck,cl,,ty])=>{const iid=`f_${k}_${i}_${ck}`;const cv=r[ck]??'';if(Array.isArray(ty))return `<select id="${iid}" aria-label="${cl}" data-l="${k}" data-i="${i}" data-c="${ck}">${ty.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}" ${cv===a?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;return `<input id="${iid}" aria-label="${cl}" ${ty==='date'?'type="date"':''} ${ty==='pecas'?'list="dl_pecas"':''} data-l="${k}" data-i="${i}" data-c="${ck}" value="${esc(cv)}">`}).join('')}<button type="button" class="x" data-del="${k}" data-i="${i}" aria-label="Remover linha">×</button></div>`).join('')}</div><button type="button" class="btn sm ghost" data-add="${k}" style="width:fit-content">+ Adicionar linha</button></div>`;}
  const type=f.t==='date'?'date':f.t==='time'?'time':'text';
  return `<div class="${cls}"><label for="${id}">${f.l}</label><input id="${id}" type="${type}" data-k="${k}" value="${esc(f.t==='cpf'?fmtCPF(val):val)}" placeholder="${esc(f.ph||'')}" ${f.list?`list="dl_${k}"`:''} ${f.t==='cpf'||f.t==='money'?'inputmode="decimal"':''}>${f.list?`<datalist id="dl_${k}">${f.list.map(x=>`<option value="${x}">`).join('')}</datalist>`:''}${help}</div>`;
}
